<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Career-Engine v69.0 - A&N Visual - GLOBAL MATRIX</title>
    <style>
        :root { --main-color: #007bb5; --bg: #0d0d0d; }
        body { margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', sans-serif; background: #000; color: #eee; }
        .editor-side { width: 42%; padding: 25px; overflow-y: auto; background: #111; border-right: 3px solid var(--main-color); }
        .preview-side { width: 58%; background: #333; display: flex; justify-content: center; padding: 40px; overflow-y: auto; }
        .logo-area { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .brand-circle { width: 45px; height: 45px; background: var(--main-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; border: 2px solid #fff; font-size: 20px; }
        .lang-grid { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn-lang { flex: 1; padding: 12px; border: none; background: #333; color: white; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-lang.active { background: var(--main-color); box-shadow: 0 0 10px var(--main-color); }
        .picker-row { margin-bottom: 15px; }
        .color-grid, .style-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 5px; }
        .color-btn { width: 100%; height: 30px; cursor: pointer; border-radius: 4px; border: 1px solid #444; }
        .style-btn { padding: 8px; background: #222; color: white; border: 1px solid #444; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .smart-label { display: block; margin-top: 15px; font-size: 11px; font-weight: bold; color: var(--main-color); text-transform: uppercase; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 4px; box-sizing: border-box; }
        .entry-box { background: #151515; padding: 15px; margin-top: 10px; border-left: 4px solid var(--main-color); border-radius: 4px; position: relative; }
        .add-btn { background: #27ae60; color: white; width: 100%; padding: 12px; border: none; margin-top: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .print-btn { background: var(--main-color); color: white; width: 100%; padding: 18px; border: none; margin-top: 25px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 6px; }
        .cv-paper { width: 210mm; min-height: 297mm; background: white; padding: 40px; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); box-sizing: border-box; position: relative; }
        .cv-header { display: flex; gap: 20px; border-bottom: 2px solid var(--main-color); padding-bottom: 20px; margin-bottom: 20px; }
        #out-photo { width: 130px; height: 160px; object-fit: cover; border: 1px solid #ccc; }
        h1#out-name { margin: 0; color: var(--main-color); font-size: 32px; }
        h3 { border-bottom: 1px solid #eee; color: var(--main-color); padding-bottom: 5px; margin-top: 25px; text-transform: uppercase; }
        @media print { .editor-side { display: none; } .preview-side { width: 100%; padding: 0; background: white; } .cv-paper { box-shadow: none; width: 100%; } }
    </style>
</head>
<body class="style-1">

<div class="editor-side">
    <div class="logo-area"><div class="brand-circle">A&N</div><h1 id="lbl-engineName">Career-Engine</h1></div>
    <div class="lang-grid">
        <button class="btn-lang active" onclick="setMode('hu', this)">HU</button>
        <button class="btn-lang" onclick="setMode('en', this)">EN</button>
        <button class="btn-lang" onclick="setMode('de', this)">DE</button>
    </div>
    <div class="picker-row"><label class="smart-label" id="lbl-colors">SZÍNEK</label><div class="color-grid" id="color-picker"></div></div>
    <div class="picker-row"><label class="smart-label" id="lbl-styles">STÍLUSOK</label><div class="style-grid" id="style-picker"></div></div>
    
    <label class="smart-label" id="lbl-photo">FOTÓ</label><input type="file" onchange="loadPhoto(event)">

    <div class="input-group">
        <div style="flex:1"><label class="smart-label" id="lbl-fName">KERESZTNÉV</label><input type="text" id="in-firstName" oninput="updatePreview()"></div>
        <div style="flex:1"><label class="smart-label" id="lbl-lName">VEZETÉKNÉV</label><input type="text" id="in-lastName" oninput="updatePreview()"></div>
    </div>
    <div class="input-group">
        <div style="flex:1"><label class="smart-label" id="lbl-city">VÁROS</label><input type="text" id="in-city" oninput="updatePreview()"></div>
        <div style="flex:1"><label class="smart-label" id="lbl-street">UTCA</label><input type="text" id="in-street" oninput="updatePreview()"></div>
        <div style="width:20%"><label class="smart-label">Hsz.</label><input type="text" id="in-house" oninput="updatePreview()"></div>
    </div>
    <label class="smart-label" id="lbl-phone">TELEFON</label><input type="text" id="in-phone" oninput="updatePreview()">
    <label class="smart-label" id="lbl-email">EMAIL</label><input type="email" id="in-email" oninput="updatePreview()">

    <label class="smart-label" id="lbl-summaryHeader">BEMUTATKOZÁS VÁLASZTÓ (KORLÁTLAN)</label>
    <select id="sel-summary" onchange="applyMatrixSummary()" style="background: #1a3a5a; color: white;">
        <option value="">-- Hozzáadás / Add / Hinzufügen --</option>
        <option value="1">🔝 Proaktív Vezető (Management)</option>
        <option value="2">💻 Tech-Guru (IT / Fejlesztő)</option>
        <option value="3">🎯 Precíz Adminisztrátor (Office)</option>
        <option value="4">🤝 Ügyfélmágnes (Sales / Customer Care)</option>
        <option value="5">🎨 Kreatív Vizionárius (Design / Marketing)</option>
        <option value="6">🚛 Logisztikai (Szállítás / Raktár)</option>
        <option value="7">⚡ Gyorsan Tanuló Junior (Pályakezdő)</option>
        <option value="8">🏗️ Megbízható Szakmunkás (Ipar)</option>
        <option value="9">🚑 Gondoskodó Profi (Egészségügy / Oktatás)</option>
        <option value="10">💎 Luxus / Hospitality (Vendéglátás)</option>
        <option value="11">🚀 Stratégiai Gondolkodó (Business)</option>
        <option value="12">📉 Elemző Zseni (Finance / Data)</option>
        <option value="13">🛠️ Karbantartó / Szerviz (Technical)</option>
        <option value="14">🛡️ Biztonság és Rend (Security)</option>
        <option value="15">🌟 Általános Motivált (Universal)</option>
    </select>
    <textarea id="in-summary" rows="8" oninput="updatePreview()" placeholder="Válogass össze több stílust..."></textarea>

    <div id="edu-area"><h3 id="lbl-eduHeader">TANULMÁNYOK</h3><div id="edu-container"></div><button onclick="addEntry('edu')" class="add-btn" id="lbl-addEdu">+ ÚJ ISKOLA</button></div>
    <div id="work-area"><h3 id="lbl-workHeader">TAPASZTALAT</h3><div id="work-container"></div><button onclick="addEntry('work')" class="add-btn" id="lbl-addWork">+ ÚJ MUNKAHELY</button></div>

    <button onclick="window.print()" class="print-btn" id="lbl-printBtn">PDF GENERÁLÁSA</button>
</div>

<div class="preview-side">
    <div class="cv-paper" id="cv-paper">
        <div class="cv-header">
            <div id="out-photo-box" style="display:none; width:130px; height:160px; overflow:hidden;"><img id="out-photo" style="width:100%;"></div>
            <div class="header-text"><h1 id="out-name">NAME</h1><div id="out-contact" style="margin-top:10px; font-size:14px; color:#555;"></div></div>
        </div>
        <div id="main-content"></div>
    </div>
</div>

<script>
    const summaryDB = {
        hu: {
            "1": "Több éves releváns szakmai és vezetői tapasztalattal rendelkező szakember vagyok. Erősségem a stratégiai tervezés és az eredményorientált csapatvezetés.",
            "2": "Technológiai fókuszú szakemberként elkötelezett vagyok az innovatív megoldások és a hatékony problémamegoldás iránt. Kiemelkedő rendszerszemlélettel és naprakész technikai tudással rendelkezem.",
            "3": "Precíz és rendszerszemléletű munkavégzés jellemez. Kimagasló tapasztalattal rendelkezem az adminisztrációs folyamatok kezelésében és a vállalati dokumentáció pontos vezetésében.",
            "4": "Ügyfélközpontú szemléletmódom és kiváló kommunikációs készségem révén hatékonyan támogatom a hosszú távú üzleti kapcsolatok építését és a professzionális ügyfélkezelést.",
            "5": "Kreatív szemléletű szakemberként a vizuális kommunikáció és a márkaépítés területén nyújtok támogatást, szem előtt tartva az esztétikum és a funkcionális hatékonyság egyensúlyát.",
            "6": "A logisztikai folyamatok és az operatív hatékonyság szakértője vagyok. Gyors döntéshozatali képességem és megoldásközpontú attitűdöm segít a komplex feladatok kezelésében.",
            "7": "Elkötelezett és fejlődésorientált pályakezdőként keresem a szakmai kihívásokat. Gyors tanulási készség és felelősségteljes munkavégzés jellemez.",
            "8": "Nagy munkabírású, megbízható szakmunkásként a minőségi és pontos kivitelezésre törekszem. Tapasztalattal rendelkezem ipari környezetben és csapatban történő munkavégzésben.",
            "9": "Empatikus és hivatástudattal rendelkező szakember vagyok. Munkám során a szakmai protokollok szigorú betartására és a legmagasabb szintű ellátásra törekszem.",
            "10": "A prémium vendéglátás területén szerzett tapasztalataimat a legmagasabb szintű szolgáltatás és a reprezentatív ügyfélélmény biztosításának szolgálatába állítom.",
            "11": "Stratégiai és elemző látásmódom segíti a komplex üzleti folyamatok átlátásában, a piaci trendek azonosítását és a hatékony döntéselőkészítést.",
            "12": "Pénzügyi és adatelemzési területen mozgok otthonosan. Precizitásom és logikai készségem a vállalati stabilitást és az adatvezérelt döntéshozatalt támogatja.",
            "13": "Műszaki orientációjú szakemberként a rendszerek folyamatos üzemeltetése és a hatékonyság biztosítása az elsődleges feladatom.",
            "14": "Felelősségteljes és fegyelmezett munkavégzés jellemzi szakmai pályafutásomat. Elkötelezett vagyok a biztonsági előírások és a rend maradéktalan betartása iránt.",
            "15": "Sokoldalú, rugalmas és szakmailag elkötelezett munkatárs vagyok. Kiemelkedő alkalmazkodóképességem segít a hatékony együttműködésben bármely vállalati környezetben."
        },
        en: {
            "1": "I am a professional with several years of relevant management experience. My strengths include strategic planning, process optimization, and result-oriented team leadership.",
            "2": "As a technology-focused professional, I am committed to innovative solutions and efficient problem-solving. I possess a strong systemic perspective and up-to-date technical knowledge.",
            "3": "My work is characterized by precision and a systematic approach. I have extensive experience in managing administrative processes and maintaining accurate corporate documentation.",
            "4": "Through my customer-centric mindset and excellent communication skills, I effectively support the building of long-term business relationships and professional client management.",
            "5": "As a creative professional, I provide support in visual communication and branding, maintaining a balance between aesthetics and functional efficiency.",
            "6": "I am an expert in logistical processes and operational efficiency. My quick decision-making ability and solution-oriented attitude help in managing complex tasks.",
            "7": "As a committed and growth-oriented entry-level professional, I am seeking professional challenges. I am characterized by quick learning and a responsible work ethic.",
            "8": "As a reliable skilled worker with high stamina, I strive for quality and precise industrial execution. I have experience in industrial environments and teamwork.",
            "9": "I am an empathetic professional with a strong sense of vocation. In my work, I strive for strict adherence to professional protocols and the highest level of care.",
            "10": "I apply my experience in premium hospitality to provide the highest level of service and a representative client experience.",
            "11": "My strategic and analytical vision assists in understanding complex business processes, identifying market trends, and ensuring effective decision preparation.",
            "12": "I am proficient in the fields of finance and data analysis. My precision and logical skills support corporate stability and data-driven decision-making.",
            "13": "As a technically oriented professional, system operation and efficient troubleshooting form the core of my expertise.",
            "14": "My professional career is characterized by responsible and disciplined work. I am committed to the full observance of safety regulations and order.",
            "15": "I am a versatile, flexible, and professionally committed colleague. My outstanding adaptability assists in effective cooperation within any corporate environment."
        },
        de: {
            "1": "Ich bin eine Fachkraft mit mehrjähriger einschlägiger Managementerfahrung. Meine Stärken liegen in der strategischen Planung, Prozessoptimierung und ergebnisorientierten Teamführung.",
            "2": "Als technologieorientierter Profi brenne ich für innovative Lösungen und effiziente Problemlösung. Ich verfüge über eine starke systemische Perspektive und aktuelles Fachwissen.",
            "3": "Meine Arbeit zeichnet sich durch Präzision und einen systematischen Ansatz aus. Ich verfüge über umfangreiche Erfahrung in der Verwaltung von Administrationsprozessen.",
            "4": "Durch meine kundenorientierte Einstellung und exzellente Kommunikationsfähigkeit unterstütze ich den Aufbau langfristiger Geschäftsbeziehungen und professionelles Kundenmanagement.",
            "5": "Als kreativer Profi unterstütze ich visuelle Kommunikation und Markenaufbau, wobei ich stets auf das Gleichgewicht zwischen Ästhetik und funktionaler Effizienz achte.",
            "6": "Ich bin Experte für Logistikprozesse und operative Effizienz. Meine schnelle Entscheidungsfähigkeit und lösungsorientierte Einstellung helfen bei komplexen Aufgaben.",
            "7": "Als engagierter und wachstumsorientierter Berufseinsteiger freue ich mich auf neue Herausforderungen. Schnelle Auffassungsgabe und Verantwortungsbewusstsein zeichnen mich aus.",
            "8": "Als zuverlässiger Facharbeiter mit hoher Ausdauer strebe ich nach Qualität und präziser Ausführung. Ich habe Erfahrung in industriellen Umgebungen und Teamarbeit.",
            "9": "Ich bin ein empathischer Profi mit einer starken Berufung. In meiner Arbeit strebe ich nach strikter Einhaltung fachlicher Protokolle und höchster Versorgungsqualität.",
            "10": "Ich nutze meine Erfahrung in der Premium-Gastronomie, um erstklassigen Service und ein repräsentatives Kundenerlebnis zu gewährleisten.",
            "11": "Meine strategische und analytische Vision hilft beim Verständnis komplexer Geschäftsprozesse, der Identifizierung von Markttrends und der effektiven Entscheidungsvorbereitung.",
            "12": "Ich bin kompetent in den Bereichen Finanzen und Datenanalyse. Meine Präzision und mein logisches Denken unterstützen die Unternehmensstabilität.",
            "13": "Als technisch versierte Fachkraft bilden der kontinuierliche Systembetrieb und eine effiziente Fehlerbehebung den Kern meiner Expertise.",
            "14": "Verantwortungsbewusstes und diszipliniertes Arbeiten zeichnet meine Karriere aus. Ich setze mich für die lückenlose Einhaltung aller Sicherheitsvorschriften ein.",
            "15": "Ich bin ein vielseitiger, flexibler und beruflich engagierter Mitarbeiter. Meine hervorragende Anpassungsfähigkeit hilft bei der effektiven Zusammenarbeit."
        }
    };

    const dictionary = {
        hu: { engineName: "Career-Engine", fName: "KERESZTNÉV", lName: "VEZETÉKNÉV", city: "VÁROS", street: "UTCA", phone: "TELEFON", email: "EMAIL", summaryHeader: "BEMUTATKOZÁS VÁLASZTÓ", summary: "BEMUTATKOZÁS-KÉPESSÉGEK", eduHeader: "TANULMÁNYOK", workHeader: "TAPASZTALAT", addEdu: "+ ÚJ ISKOLA", addWork: "+ ÚJ MUNKAHELY", printBtn: "PDF GENERÁLÁSA", addr: "Cím:", colors: "SZÍNEK", styles: "STÍLUSOK" },
        en: { engineName: "Career-Engine", fName: "FIRST NAME", lName: "LAST NAME", city: "CITY", street: "STREET", phone: "PHONE", email: "EMAIL", summaryHeader: "SUMMARY SELECTOR", summary: "SUMMARY-SKILLS", eduHeader: "EDUCATION", workHeader: "EXPERIENCE", addEdu: "+ ADD SCHOOL", addWork: "+ ADD JOB", printBtn: "GENERATE PDF", addr: "Address:", colors: "COLORS", styles: "STYLES" },
        de: { engineName: "Career-Engine", fName: "VORNAME", lName: "NACHNAME", city: "STADT", street: "STRASSE", phone: "TELEFON", email: "EMAIL", summaryHeader: "PROFIL AUSWAHL", summary: "PROFIL-FÄHIGKEITEN", eduHeader: "BILDUNG", workHeader: "ERFAHRUNG", addEdu: "+ SCHULE", addWork: "+ JOB", printBtn: "PDF GENERIEREN", addr: "Adresse:", colors: "FARBEN", styles: "STILE" }
    };

    let currentLang = 'hu';

    function setMode(l, btn) {
        currentLang = l;
        document.querySelectorAll('.btn-lang').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateInterface();
        updatePreview();
    }

    function updateInterface() {
        const d = dictionary[currentLang];
        for (let key in d) {
            const el = document.getElementById('lbl-' + key);
            if (el) el.innerText = d[key];
        }
    }

    function addEntry(type) {
        const div = document.createElement('div');
        div.className = 'entry-box';
        div.innerHTML = `
            <input type="text" class="e-main" placeholder="Intézmény / Cég" oninput="updatePreview()">
            <input type="text" class="e-sub" placeholder="Időtartam" oninput="updatePreview()">
            <input type="text" class="e-desc" placeholder="Beosztás / Leírás" oninput="updatePreview()">
            <button style="position:absolute; top:5px; right:5px; background:red; color:white; border:none; cursor:pointer;" onclick="this.parentElement.remove(); updatePreview();">×</button>
        `;
        document.getElementById(type + '-container').appendChild(div);
        updatePreview();
    }

    function applyMatrixSummary() {
        const sel = document.getElementById('sel-summary');
        const target = document.getElementById('in-summary');
        if (sel.value && summaryDB[currentLang][sel.value]) {
            target.value += (target.value ? "\n\n" : "") + summaryDB[currentLang][sel.value];
            sel.value = "";
            updatePreview();
        }
    }

    function updatePreview() {
        const d = dictionary[currentLang];
        const l = document.getElementById('in-lastName').value || "";
        const f = document.getElementById('in-firstName').value || "";
        document.getElementById('out-name').innerText = (currentLang === 'hu' ? l + " " + f : f + " " + l).toUpperCase() || "NAME";
        
        document.getElementById('out-contact').innerHTML = `
            <b>${d.phone}:</b> ${document.getElementById('in-phone').value}<br>
            <b>EMAIL:</b> ${document.getElementById('in-email').value}<br>
            <b>${d.addr}</b> ${document.getElementById('in-city').value}, ${document.getElementById('in-street').value} ${document.getElementById('in-house').value}
        `;

        let html = `<h3>${d.summary}</h3><p style="white-space: pre-wrap;">${document.getElementById('in-summary').value}</p>`;
        
        ['edu', 'work'].forEach(type => {
            let sectionHtml = `<h3>${d[type + 'Header']}</h3>`;
            document.querySelectorAll('#' + type + '-container .entry-box').forEach(box => {
                const main = box.querySelector('.e-main').value;
                const sub = box.querySelector('.e-sub').value;
                const desc = box.querySelector('.e-desc').value;
                if(main) sectionHtml += `<div style="margin-bottom:15px"><b>${main}</b> (${sub})<br><i>${desc}</i></div>`;
            });
            html += sectionHtml;
        });
        document.getElementById('main-content').innerHTML = html;
    }

    function loadPhoto(event) {
        const reader = new FileReader();
        reader.onload = function() {
            const out = document.getElementById('out-photo');
            out.src = reader.result;
            document.getElementById('out-photo-box').style.display = 'block';
        }
        reader.readAsDataURL(event.target.files[0]);
    }

    window.onload = () => {
        const colors = ["#007bb5", "#e67e22", "#27ae60", "#c0392b", "#8e44ad", "#1a1a1a", "#f1c40f", "#16a085", "#d35400", "#2c3e50"];
        colors.forEach(c => {
            let b = document.createElement('div'); b.className = 'color-btn'; b.style.background = c;
            b.onclick = () => { document.documentElement.style.setProperty('--main-color', c); updatePreview(); };
            document.getElementById('color-picker').appendChild(b);
        });
        for(let i=1; i<=10; i++) {
            let b = document.createElement('button'); b.className = 'style-btn'; b.innerText = i;
            b.onclick = () => { document.body.className = 'style-' + i; updatePreview(); };
            document.getElementById('style-picker').appendChild(b);
        }
        updateInterface();
        updatePreview();
    };
</script>
</body>
</html>
