<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Career-Engine v69.0 - A&N Visual</title>
    <style>
        :root { --main-color: #007bb5; --bg: #0d0d0d; }
        body { margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', sans-serif; background: #000; color: #eee; }
        .editor-side { width: 42%; padding: 25px; overflow-y: auto; background: #111; border-right: 3px solid var(--main-color); }
        .preview-side { width: 58%; background: #333; display: flex; justify-content: center; padding: 40px; overflow-y: auto; }
        .logo-area { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .brand-circle { width: 45px; height: 45px; background: var(--main-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; border: 2px solid #fff; font-size: 20px; }
        .info-panel { background: #1a3a5a; padding: 15px; border-radius: 8px; margin-bottom: 12px; border-left: 5px solid #f1c40f; font-size: 13px; }
        .lang-grid { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn-lang { flex: 1; padding: 12px; border: none; background: #333; color: white; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-lang.active { background: var(--main-color); box-shadow: 0 0 10px var(--main-color); }
        .picker-row { margin-bottom: 15px; }
        .color-grid, .style-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 5px; }
        .color-btn { width: 100%; height: 30px; cursor: pointer; border-radius: 4px; border: 1px solid #444; }
        .style-btn { padding: 8px; background: #222; color: white; border: 1px solid #444; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .smart-label { display: block; margin-top: 15px; font-size: 11px; font-weight: bold; color: var(--main-color); text-transform: uppercase; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 4px; box-sizing: border-box; }
        .input-group { display: flex; gap: 10px; }
        .entry-box { background: #151515; padding: 15px; margin-top: 10px; border-left: 4px solid var(--main-color); border-radius: 4px; position: relative; }
        .add-btn { background: #27ae60; color: white; width: 100%; padding: 12px; border: none; margin-top: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .print-btn { background: var(--main-color); color: white; width: 100%; padding: 18px; border: none; margin-top: 25px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 6px; }
        
        .cv-paper { width: 210mm; min-height: 297mm; background: white; padding: 40px; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); box-sizing: border-box; position: relative; }
        .cv-header { display: flex; gap: 20px; border-bottom: 2px solid var(--main-color); padding-bottom: 20px; margin-bottom: 20px; }
        h1#out-name { margin: 0; color: var(--main-color); font-size: 32px; }
        h3 { border-bottom: 1px solid #eee; color: var(--main-color); padding-bottom: 5px; margin-top: 25px; text-transform: uppercase; }

        /* A 10 STÍLUS */
        body.style-1 .cv-paper { border-top: 20px solid var(--main-color); }
        body.style-2 .cv-header { flex-direction: column; text-align: center; }
        body.style-3 .cv-header { flex-direction: row-reverse; }
        body.style-4 h3 { background: #f4f4f4; padding: 10px; border-left: 10px solid var(--main-color); }
        body.style-5 .cv-paper { font-family: 'Georgia', serif; }
        body.style-6 .cv-header { border-bottom: 10px double var(--main-color); }
        body.style-7 .cv-paper { background: #fafafa; border: 1px solid #ddd; }
        body.style-8 #out-name { letter-spacing: 8px; text-align: center; width: 100%; }
        body.style-9 .cv-header { align-items: flex-end; }
        body.style-10 .cv-paper::before { content: ''; position: absolute; top: 0; left: 0; width: 10px; height: 100%; background: var(--main-color); }

        @media print { .editor-side { display: none; } .preview-side { width: 100%; padding: 0; background: white; } .cv-paper { box-shadow: none; width: 100%; } }
    </style>
</head>
<body class="style-1">

<div class="editor-side">
    <div class="logo-area"><div class="brand-circle">A&N</div><h1 id="lbl-engineName">Career-Engine</h1></div>
    <div class="info-panel"><b id="lbl-atsTitle">🚀 GIGA ATS TIPPEK:</b><div id="lbl-atsTips" style="white-space: pre-wrap; margin-top: 5px;"></div></div>
    
    <div class="lang-grid">
        <button class="btn-lang active" onclick="setMode('hu', this)">HU</button>
        <button class="btn-lang" onclick="setMode('en', this)">EN</button>
        <button class="btn-lang" onclick="setMode('de', this)">DE</button>
    </div>

    <div class="picker-row"><label class="smart-label" id="lbl-colors">SZÍNEK</label><div class="color-grid" id="color-picker"></div></div>
    <div class="picker-row"><label class="smart-label" id="lbl-styles">STÍLUSOK</label><div class="style-grid" id="style-picker"></div></div>

    <div class="input-group">
        <div style="flex:1"><label class="smart-label" id="lbl-fName">KERESZTNÉV</label><input type="text" id="in-firstName" oninput="updatePreview()"></div>
        <div style="flex:1"><label class="smart-label" id="lbl-lName">VEZETÉKNÉV</label><input type="text" id="in-lastName" oninput="updatePreview()"></div>
    </div>

    <label class="smart-label" id="lbl-summary">BEMUTATKOZÁS VÁLASZTÓ (15 OPCIÓ)</label>
    <select id="sel-summary" onchange="applyMatrixSummary()" style="border: 1px solid #007bb5; background: #1a3a5a; color: white;">
        <option value="">-- Válassz / Select / Wählen --</option>
        <option value="1">🔝 Proaktív Vezető (Management)</option>
        <option value="2">💻 Tech-Guru (IT / Fejlesztő)</option>
        <option value="3">🎯 Precíz Adminisztrátor (Office)</option>
        <option value="4">🤝 Ügyfélmágnes (Sales)</option>
        <option value="5">🎨 Kreatív Vizionárius (Design)</option>
        <option value="6">🚛 Logisztikai Nindzsa (Logistics)</option>
        <option value="7">⚡ Gyorsan Tanuló Junior (Junior)</option>
        <option value="8">🏗️ Megbízható Szakmunkás (Industry)</option>
        <option value="9">🚑 Gondoskodó Profi (Health)</option>
        <option value="10">💎 Luxus / Hospitality (Hospitality)</option>
        <option value="11">🚀 Stratégiai Gondolkodó (Business)</option>
        <option value="12">📉 Elemző Zseni (Finance)</option>
        <option value="13">🛠️ Karbantartó / Szerviz (Technical)</option>
        <option value="14">🛡️ Biztonság és Rend (Security)</option>
        <option value="15">🌟 Általános Motivált (Universal)</option>
    </select>
    <textarea id="in-summary" rows="5" oninput="updatePreview()" placeholder="Válassz fent..."></textarea>

    <div id="edu-area"><h3 id="lbl-eduHeader">TANULMÁNYOK</h3><div id="edu-container"></div><button onclick="addEntry('edu')" class="add-btn" id="lbl-addEdu">+ ÚJ ISKOLA</button></div>
    <div id="work-area"><h3 id="lbl-workHeader">TAPASZTALAT</h3><div id="work-container"></div><button onclick="addEntry('work')" class="add-btn" id="lbl-addWork">+ ÚJ MUNKAHELY</button></div>

    <button onclick="window.print()" class="print-btn" id="lbl-printBtn">PDF GENERÁLÁSA</button>
</div>

<div class="preview-side">
    <div class="cv-paper" id="cv-paper">
        <div class="cv-header">
            <div class="header-text">
                <h1 id="out-name">NAME</h1>
                <div id="out-contact" style="margin-top:10px; font-size:14px; color:#555;"></div>
            </div>
        </div>
        <div id="main-content"></div>
    </div>
</div>

<script>
    const dictionary = {
        hu: { 
            engineName: "Career-Engine", atsTitle: "🚀 API TIPPEK:", atsTips: "• Kulcsszavak!\n• Számok!\n• Jó fotó!", fName: "KERESZTNÉV", lName: "VEZETÉKNÉV", summary: "BEMUTATKOZÁS", eduHeader: "TANULMÁNYOK", workHeader: "TAPASZTALAT", addEdu: "+ ÚJ ISKOLA", addWork: "+ ÚJ MUNKAHELY", printBtn: "PDF GENERÁLÁSA", colors: "SZÍNEK", styles: "STÍLUSOK",
            sum_1: "Több éves vezetői tapasztalattal rendelkező szakember vagyok, aki a stratégiai tervezésben és a csapatok motiválásában hisz. Célom az eredményesség maximalizálása.",
            sum_2: "Technológiai szemléletű szakemberként szenvedélyem az innováció és a problémamegoldás. Erős technikai alapokkal és folyamatos tanulási vággyal rendelkezem.",
            sum_3: "Rendszerszemléletű, precíz munkavégzés jellemez. Az adminisztrációs folyamatok optimalizálásában és a pontos dokumentációban vagyok a legerősebb.",
            sum_4: "Ügyfélközpontú attitűdöm segít a hosszú távú üzleti kapcsolatok építésében. Kiváló kommunikációs készséggel kezelem a konfliktusokat.",
            sum_5: "Kreatív gondolkodásmódommal és vizuális látásmódommal segítem a márkák építését. Nem csak a formát, hanem a funkciót is szem előtt tartom.",
            sum_6: "A logisztika és a hatékonyság megszállottja vagyok. Gyors döntéshozatali képességem segít a váratlan helyzetek megoldásában is.",
            sum_7: "Lelkes pályakezdőként várom a kihívásokat. Gyorsan tanulok, megbízható vagyok, és elkötelezett a szakmai fejlődés iránt.",
            sum_8: "Nagy munkabírású szakemberként a minőségi és pontos kivitelezésre törekszem. Tapasztalatom van ipari környezetben és csapatmunkában is.",
            sum_9: "Empatikus és türelmes szakember vagyok, aki elkötelezett mások segítése és a szakmai hivatás gyakorlása mellett.",
            sum_10: "A vendéglátásban szerzett tapasztalatomat a legmagasabb szintű kiszolgálás és a vendégelégedettség szolgálatába állítom.",
            sum_11: "Elemző és stratégiai látásmódom segít a komplex üzleti problémák átlátásában és a jövőbeli trendek előrejelzésében.",
            sum_12: "A számok és adatok világában mozgok otthonosan. Precizitásom és logikai készségem a pénzügyi stabilitást szolgálja.",
            sum_13: "Műszaki beállítottságú szakemberként a hibaelhárítás és a folyamatos üzemeltetés biztosítása az elsődleges feladatom.",
            sum_14: "Felelősségteljes és fegyelmezett munkavégzés jellemzi a biztonsági területen szerzett pályafutásomat.",
            sum_15: "Sokoldalú és rugalmas munkatárs vagyok, aki bármilyen környezetben megtalálja a közös hangot a kollégákkal."
        },
        en: { 
            engineName: "Career-Engine", atsTitle: "🚀 API TIPS:", atsTips: "• Keywords!\n• Numbers!\n• Photo!", fName: "FIRST NAME", lName: "LAST NAME", summary: "SUMMARY", eduHeader: "EDUCATION", workHeader: "EXPERIENCE", addEdu: "+ ADD SCHOOL", addWork: "+ ADD JOB", printBtn: "GENERATE PDF", colors: "COLORS", styles: "STYLES",
            sum_1: "I am a professional with several years of leadership experience who believes in strategic planning and team motivation. My goal is to maximize effectiveness.",
            sum_2: "As a technology-oriented professional, my passion is innovation and problem-solving. I have strong technical foundations.",
            sum_3: "I am characterized by a systematic and precise way of working. I am strongest in optimizing administrative processes.",
            sum_4: "My customer-oriented attitude helps build long-term business relationships. I handle conflicts with excellent communication.",
            sum_5: "I help build brands with my creative thinking and visual perspective. I keep both form and function in mind.",
            sum_6: "I am obsessed with logistics and efficiency. My quick decision-making ability helps solve unexpected situations.",
            sum_7: "As an enthusiastic beginner, I look forward to challenges. I learn quickly and am committed to professional development.",
            sum_8: "As a high-capacity professional, I strive for quality and precise execution. I have experience in industrial environments.",
            sum_9: "I am an empathetic and patient professional committed to helping others and practicing my professional calling.",
            sum_10: "I put my experience in hospitality at the service of the highest level of service and guest satisfaction.",
            sum_11: "My analytical and strategic vision helps in understanding complex business problems and forecasting trends.",
            sum_12: "I am at home in the world of numbers and data. My precision and logical skills serve financial stability.",
            sum_13: "As a technically-minded professional, troubleshooting and ensuring continuous operation is my primary task.",
            sum_14: "Responsible and disciplined work characterizes my career in the security field.",
            sum_15: "I am a versatile and flexible team member who finds common ground in any environment for mutual success."
        },
        de: { 
            engineName: "Career-Engine", atsTitle: "🚀 API TIPPS:", atsTips: "• Keywords!\n• Zahlen!\n• Foto!", fName: "VORNAME", lName: "NACHNAME", summary: "PROFIL", eduHeader: "BILDUNG", workHeader: "ERFAHRUNG", addEdu: "+ SCHULE", addWork: "+ JOB", printBtn: "PDF GENERIEREN", colors: "FARBEN", styles: "STILE",
            sum_1: "Ich bin eine Führungskraft mit mehrjähriger Erfahrung, die an strategische Planung und Teammotivation glaubt.",
            sum_15: "Ich bin ein vielseitiges Teammitglied, das in jeder Umgebung den richtigen Ton trifft, um gemeinsam erfolgreich zu sein."
        }
    };

    let currentLang = 'hu';

    function setMode(l, btn) {
        currentLang = l;
        document.querySelectorAll('.btn-lang').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateInterface();
        updatePreview();
    }

    function updateInterface() {
        const d = dictionary[currentLang];
        for (let key in d) {
            const el = document.getElementById('lbl-' + key);
            if (el) el.innerText = d[key];
        }
        document.getElementById('lbl-atsTips').innerText = d.atsTips;
    }

    function addEntry(type) {
        const div = document.createElement('div');
        div.className = 'entry-box';
        div.innerHTML = `
            <input type="text" class="e-main" placeholder="Név / Name" oninput="updatePreview()">
            <input type="text" class="e-sub" placeholder="Idő / Time" oninput="updatePreview()">
            <button style="position:absolute; top:5px; right:5px; background:red; color:white; border:none; cursor:pointer;" onclick="this.parentElement.remove(); updatePreview();">×</button>
        `;
        document.getElementById(type + '-container').appendChild(div);
    }

    function applyMatrixSummary() {
        const sel = document.getElementById('sel-summary');
        const target = document.getElementById('in-summary');
        const key = "sum_" + sel.value;
        if (sel.value && dictionary[currentLang][key]) {
            target.value = dictionary[currentLang][key];
            updatePreview();
        }
    }

    function updatePreview() {
        const l = document.getElementById('in-lastName').value || "";
        const f = document.getElementById('in-firstName').value || "";
        document.getElementById('out-name').innerText = (currentLang === 'hu' ? l + " " + f : f + " " + l).toUpperCase() || "NAME";
        
        let html = `<h3>${dictionary[currentLang].summary}</h3><p style="white-space: pre-wrap;">${document.getElementById('in-summary').value}</p>`;
        
        ['edu', 'work'].forEach(type => {
            let sectionHtml = `<h3>${dictionary[currentLang][type + 'Header']}</h3>`;
            document.querySelectorAll('#' + type + '-container .entry-box').forEach(box => {
                sectionHtml += `<div><b>${box.querySelector('.e-main').value}</b> - ${box.querySelector('.e-sub').value}</div>`;
            });
            html += sectionHtml;
        });
        document.getElementById('main-content').innerHTML = html;
    }

    window.onload = () => {
        const colors = ["#007bb5", "#e67e22", "#27ae60", "#c0392b", "#8e44ad"];
        colors.forEach(c => {
            let b = document.createElement('div'); b.className = 'color-btn'; b.style.background = c;
            b.onclick = () => { document.documentElement.style.setProperty('--main-color', c); updatePreview(); };
            document.getElementById('color-picker').appendChild(b);
        });
        for(let i=1; i<=10; i++) {
            let b = document.createElement('button'); b.className = 'style-btn'; b.innerText = i;
            b.onclick = () => { document.body.className = 'style-' + i; };
            document.getElementById('style-picker').appendChild(b);
        }
        updateInterface();
    };
</script>
</body>
</html>
