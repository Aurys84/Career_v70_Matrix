<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Career-Engine v70.0 - A&N Visual - GLOBAL MATRIX</title>
    <style>
        :root { --main-color: #007bb5; }
        body { margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', sans-serif; background: #000; color: #eee; transition: 0.3s; }
        .editor-side { width: 42%; padding: 25px; overflow-y: auto; background: #111; border-right: 3px solid var(--main-color); }
        .preview-side { width: 58%; background: #333; display: flex; justify-content: center; padding: 40px; overflow-y: auto; }
        .logo-area { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .brand-circle { width: 45px; height: 45px; background: var(--main-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; border: 2px solid #fff; font-size: 20px; }
        .lang-grid { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn-lang { flex: 1; padding: 12px; border: none; background: #333; color: white; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-lang.active { background: var(--main-color); box-shadow: 0 0 10px var(--main-color); }
        .picker-row { margin-bottom: 15px; }
        .color-grid, .style-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 5px; }
        .color-btn { width: 100%; height: 30px; cursor: pointer; border-radius: 4px; border: 1px solid #444; }
        .style-btn { padding: 8px; background: #222; color: white; border: 1px solid #444; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .smart-label { display: block; margin-top: 15px; font-size: 11px; font-weight: bold; color: var(--main-color); text-transform: uppercase; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 4px; box-sizing: border-box; }
        .entry-box { background: #151515; padding: 15px; margin-top: 10px; border-left: 4px solid var(--main-color); border-radius: 4px; position: relative; }
        .add-btn { background: #27ae60; color: white; width: 100%; padding: 12px; border: none; margin-top: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .print-btn { background: var(--main-color); color: white; width: 100%; padding: 18px; border: none; margin-top: 25px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 6px; }
        .cv-paper { width: 210mm; min-height: 297mm; background: white; padding: 40px; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); box-sizing: border-box; position: relative; }
        .cv-header { display: flex; gap: 20px; border-bottom: 2px solid var(--main-color); padding-bottom: 20px; margin-bottom: 20px; }
        h1#out-name { margin: 0; color: var(--main-color); font-size: 32px; }
        h3 { border-bottom: 1px solid #eee; color: var(--main-color); padding-bottom: 5px; margin-top: 25px; text-transform: uppercase; }

       h3 { border-bottom: 1px solid #eee; color: var(--main-color); padding-bottom: 5px; margin-top: 25px; text-transform: uppercase; }

        /* STÍLUSOK (1-15) - A&N Visual Global Matrix */
        
        /* 1. Modern Slim: Vékony kék sáv a bal szélen */
        body.style-1 .cv-paper { border-left: 15px solid var(--main-color); }

        /* 2. Executive: Vastag fejléc, színes blokkban a név */
        body.style-2 .cv-header { background: var(--main-color); color: white; padding: 30px; margin: -40px -40px 30px -40px; }
        body.style-2 #out-name { color: white; }

        /* 3. Creative Split: Függőlegesen kettéosztott design */
        body.style-3 .cv-header { flex-direction: column; width: 35%; border-right: 1px solid #eee; height: 100%; position: absolute; left: 40px; top: 40px; }
        body.style-3 #main-content { margin-left: 40%; }

        /* 4. Tech-Grid: Sötét, blokkos alcímek */
        body.style-4 h3 { background: #333; color: white; padding: 8px 15px; border-radius: 4px; border: none; }

        /* 5. Minimalist Serif: Klasszikus elegancia */
        body.style-5 .cv-paper { font-family: 'Times New Roman', serif; text-align: justify; }

        /* 6. Dark Mode Paper: Sötét alap, színes kiemeléssel */
        body.style-6 .cv-paper { background: #222; color: #ddd; }
        body.style-6 h3 { color: var(--main-color); border-bottom-color: #444; }

        /* 7. Underline Focus: Teljes szélességű vonalak */
        body.style-7 h3 { border-bottom: 4px solid var(--main-color); width: 100%; }

        /* 8. Floating Card: Kártyaszerű belső elrendezés */
        body.style-8 .cv-paper { padding: 60px; background: #f0f0f0; }
        body.style-8 #main-content, body.style-8 .cv-header { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        /* 9. Infographic: Kör fotó és színes keret */
        body.style-9 #out-photo-box { 
            display: block !important; 
            border-radius: 50% !important; 
            border: 4px solid var(--main-color) !important; 
            overflow: hidden; 
        }
        body.style-9 #out-photo { border-radius: 50%; width: 100%; height: 100%; object-fit: cover; }

        /* 10. Sidebar Accent: Szakaszok bal oldali kiemelése */
        body.style-10 #main-content div, body.style-10 #main-content p { 
            border-left: 4px solid var(--main-color) !important; 
            padding-left: 15px !important; 
            margin-left: 5px;
        }

        /* 11. Bold Typography: Brutál név, vékony kiegészítők */
        body.style-11 #out-name { 
            font-size: 55px !important; 
            font-weight: 900 !important; 
            line-height: 0.9 !important; 
            letter-spacing: -2px;
            margin-bottom: 20px;
        }
        body.style-11 #out-contact { font-weight: 300; text-transform: uppercase; letter-spacing: 2px; }
        /* 12. Geometric: Átlós díszítés a sarokban */
        body.style-12 .cv-paper::after { content: ''; position: absolute; top: 0; right: 0; border-style: solid; border-width: 0 100px 100px 0; border-color: transparent var(--main-color) transparent transparent; }

        /* 13. Double Column: Két oszlopos elrendezés */
        body.style-13 #main-content { column-count: 2; column-gap: 30px; }

        /* 14. Industrial: Keretes, "dobozos" felépítés */
        body.style-14 h3, body.style-14 .cv-header { border: 2px solid #000; padding: 10px; margin-bottom: 15px; }

        /* 15. Premium Border: Dupla színes keret az egész papír körül */
        body.style-15 .cv-paper { border: 10px double var(--main-color); }

      @media print { 
    .editor-side { display: none; } 
    .preview-side { width: 100%; padding: 0; background: white; overflow: hidden; } 
    .cv-paper { box-shadow: none; width: 100%; margin: 0; border: none; } 
    body { overflow: hidden; }
}    
    </style>
</head>

        refreshMenu();
        updateInterface();
        updatePreview();

        const sel = document.getElementById('sel-summary');
        if(!sel) return;
        sel.innerHTML = `<option value="">${dictionary[currentLang].select_hint}</option>`;
        dictionary[currentLang].menu.forEach((text, i) => {
            sel.innerHTML += `<option value="${i+1}">${text}</option>`;
        });
    }

        const d = dictionary[currentLang];
        for (let key in d) {
            const el = document.getElementById('lbl-' + key);
            if (el) el.innerText = (typeof d[key] === 'string') ? d[key] : d[key][0];
        }
    }

   function applyMatrixSummary() {
    const sel = document.getElementById('sel-summary');
    if (sel && sel.value) {
        if (!selectedIndices.includes(sel.value)) {
            selectedIndices.push(sel.value);
        }
        sel.value = ""; 
    }
    document.getElementById('in-summary').value = selectedIndices.map(idx => summariesDB[currentLang][idx] || "").join("\n\n");
    updatePreview();
}

    function loadPhoto(event) {
        const reader = new FileReader();
        reader.onload = function() {
            document.getElementById('out-photo-box').style.display = 'block';
            document.getElementById('out-photo').src = reader.result;
            updatePreview();
        }
        if(event.target.files[0]) reader.readAsDataURL(event.target.files[0]);
    }

    window.onload = () => {
        const colors = ["#007bb5", "#e67e22", "#27ae60", "#c0392b", "#8e44ad", "#1a1a1a", "#f1c40f", "#16a085", "#d35400", "#2c3e50"];
        colors.forEach(c => {
            let b = document.createElement('div'); b.className = 'color-btn'; b.style.background = c;
            b.onclick = () => { document.documentElement.style.setProperty('--main-color', c); updatePreview(); };
            document.getElementById('color-picker').appendChild(b);
        });

        for(let i = 1; i <= 15; i++) {
            let b = document.createElement('button'); b.className = 'style-btn'; b.innerText = i;
            b.onclick = () => { document.body.className = 'style-' + i; updatePreview(); };
            document.getElementById('style-picker').appendChild(b);
        }
        refreshMenu();
        updateInterface();
        updatePreview();
    };
</script>
</script>
</body>
