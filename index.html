<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Career-Engine v70.0 - A&N Visual - GLOBAL MATRIX</title>
    
    <script>
        if (typeof nw === 'undefined') {
            window.isWebMode = true; 
        } else {
            window.isWebMode = false;
        }
    </script>
    <link rel="manifest" href="manifest.json"> 
    <style>
        :root { --main-color: #007bb5; }
        body { margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', sans-serif; background: #000; color: #eee; transition: 0.3s; }
        .editor-side { width: 42%; padding: 25px; overflow-y: auto; background: #111; border-right: 3px solid var(--main-color); }
        .preview-side { width: 58%; background: #333; display: flex; justify-content: center; padding: 40px; overflow-y: auto; }
        .logo-area { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .brand-circle { width: 45px; height: 45px; background: var(--main-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; border: 2px solid #fff; font-size: 20px; }
        .lang-grid { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn-lang { flex: 1; padding: 12px; border: none; background: #333; color: white; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-lang.active { background: var(--main-color); box-shadow: 0 0 10px var(--main-color); }
        .picker-row { margin-bottom: 15px; }
        .color-grid, .style-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 5px; }
        .color-btn { width: 100%; height: 30px; cursor: pointer; border-radius: 4px; border: 1px solid #444; }
        .style-btn { padding: 8px; background: #222; color: white; border: 1px solid #444; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .smart-label { display: block; margin-top: 15px; font-size: 11px; font-weight: bold; color: var(--main-color); text-transform: uppercase; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 4px; box-sizing: border-box; }
        .entry-box { background: #151515; padding: 15px; margin-top: 10px; border-left: 4px solid var(--main-color); border-radius: 4px; position: relative; }
        .add-btn { background: #27ae60; color: white; width: 100%; padding: 12px; border: none; margin-top: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .print-btn { background: var(--main-color); color: white; width: 100%; padding: 18px; border: none; margin-top: 25px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 6px; }
        .cv-paper { width: 210mm; min-height: 297mm; background: white; padding: 40px; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); box-sizing: border-box; position: relative; }
        .cv-header { display: flex; gap: 20px; border-bottom: 2px solid var(--main-color); padding-bottom: 20px; margin-bottom: 20px; }
        h1#out-name { margin: 0; color: var(--main-color); font-size: 32px; }
        h3 { border-bottom: 1px solid #eee; color: var(--main-color); padding-bottom: 5px; margin-top: 25px; text-transform: uppercase; }

        body.style-1 .cv-paper { border-top: 20px solid var(--main-color); }
        body.style-2 .cv-header { flex-direction: column; text-align: center; }
        body.style-3 .cv-header { flex-direction: row-reverse; }
        body.style-4 h3 { background: #f4f4f4; padding: 10px; border-left: 10px solid var(--main-color); border-bottom: none; }
        body.style-5 .cv-paper { font-family: 'Georgia', serif; }
        body.style-6 .cv-header { border-bottom: 8px double var(--main-color); }
        body.style-7 .cv-paper { background: #f9f9f9; border: 1px solid #ddd; }
        body.style-8 #out-name { letter-spacing: 5px; text-align: center; width: 100%; }
        body.style-9 .cv-header { align-items: flex-end; border-bottom-width: 5px; }
        body.style-10 .cv-paper::before { content: ''; position: absolute; top: 0; left: 0; width: 15px; height: 100%; background: var(--main-color); }

        @media print {
            .editor-side, .action-bar, .print-btn, #lbl-printBtn, .lang-grid { display: none !important; }
            .preview-side { display: block !important; width: 100% !important; height: auto !important; padding: 0 !important; margin: 0 !important; overflow: hidden !important; background: white !important; }
            .cv-paper { width: 210mm !important; height: 297mm !important; margin: 0 auto !important; box-shadow: none !important; border: none !important; overflow: hidden !important; }
            @page { size: A4; margin: 0; }
            body { margin: 0 !important; overflow: hidden !important; background: white !important; }
        }
    </style> 
</head>

<body class="style-1">

<div class="editor-side" id="editor-side">
    <div class="logo-area">

               <span>💾</span> PDF GENERÁLÁSA ÉS MENTÉSE

    <div class="lang-grid">

    <div class="input-group" style="display: flex; gap: 10px;">
        <div style="flex:1">

        <div style="flex:1">

    <div class="input-group" style="display: flex; gap: 10px;">
        <div style="flex:1">
            <label class="smart-label">≡ TÍPUS</label>
            <select id="in-street-type" onchange="updatePreview()">
                <option value="utca">utca / street / straße</option>
                <option value="út">út / road / straße</option>
                <option value="tér">tér / square / platz</option>
            </select>
        </div>
        <div style="width:30%">
            <label class="smart-label">HÁZSZÁM</label>
            <input type="text" id="in-house" oninput="updatePreview()">
        </div>
    </div>

    <label class="smart-label" id="lbl-phone">TELEFON</label>
    <input type="text" id="in-phone" oninput="updatePreview()">

    <label class="smart-label" id="lbl-email">EMAIL</label>
    <input type="email" id="in-email" oninput="updatePreview()">

    <label class="smart-label" id="lbl-summaryHeader">BEMUTATKOZÁS VÁLASZTÓ</label>
    <select id="sel-summary" onchange="applyMatrixSummary()" style="background: #1a3a5a; color: white; border: 1px solid #007bb5;"></select>

    <textarea id="in-summary" rows="8" oninput="updatePreview()"></textarea>

    <div id="edu-area">
        <h3 id="lbl-eduHeader">TANULMÁNYOK</h3>
        <div id="edu-container"></div>
        <button onclick="addEntry('edu')" class="add-btn" id="lbl-addEdu">+ ÚJ ISKOLA</button>
    </div>

    <div id="work-area">
        <h3 id="lbl-workHeader">TAPASZTALAT</h3>
        <div id="work-container"></div>
        <button onclick="addEntry('work')" class="add-btn" id="lbl-addWork">+ ÚJ MUNKAHELY</button>
    </div>

   <button onclick="if(window.isWebMode){ window.print(); } else { profiMentesPNG(); }" class="print-btn" id="lbl-printBtn">
        MENTÉS (PDF/PNG)
    </button>
</div>

<div class="preview-side" id="preview-side">
    <div class="cv-paper" id="cv-paper">
        <div class="cv-header">
            <div id="out-photo-box" style="display:none; width:130px; height:160px; overflow:hidden; border: 1px solid #eee; margin-right: 20px;">
                <img id="out-photo" style="width:100%; height:100%; object-fit: cover;">
            </div>
            <div class="header-text">
                <h1 id="out-name">NAME</h1>
                <div id="out-contact" style="margin-top:10px; font-size:14px; color:#555;"></div>
            </div>
        </div>
        <div id="main-content"></div>
    </div>
</div>

<script src="database.js"></script>
<script>
function profiMentesPNG() {
    try {
        const nw = require('nw.gui');
        const win = nw.Window.get();
        const fs = require('fs');
        let saver = document.createElement('input');
        saver.setAttribute('type', 'file');
        saver.setAttribute('nwsaveas', 'Career-Engine-Export.png');
        saver.setAttribute('accept', '.png');
        saver.style.display = 'none';
        document.body.appendChild(saver);
        saver.addEventListener('change', function() {
            const filePath = this.value;
            if (!filePath) return;
            document.getElementById('editor-side').style.display = 'none';
            document.getElementById('preview-side').style.width = '100%';
            document.getElementById('preview-side').style.padding = '0';
            document.body.style.overflow = 'hidden';
            setTimeout(() => {
                win.capturePage(function(buffer) {
                    fs.writeFile(filePath, buffer, function (err) {
                        document.getElementById('editor-side').style.display = 'block';
                        document.getElementById('preview-side').style.width = '58%';
                        document.getElementById('preview-side').style.padding = '40px';
                        document.body.style.overflow = 'auto';
                        document.body.removeChild(saver);
                        if (err) alert("Hiba: " + err);
                    });
                }, { format : 'png', datatype : 'buffer' });
            }, 100);
        });
        saver.click();
    } catch (e) { window.print(); }
}

const summariesDB = {

    en: { "1": "Experienced professional with leadership skills...", "2": "Technology-focused professional...", "3": "Skilled in precision administration...", "4": "Supporting sales processes...", "5": "Supporting projects with creative solutions...", "6": "Ensuring smooth flow of goods...", "7": "Motivated junior looking for growth...", "8": "Guaranteeing precise work in industrial fields...", "9": "Dedicated to helping people in education and healthcare...", "10": "Providing premium service in hospitality...", "11": "Strategic planning for success...", "12": "Data-driven analysis and reporting...", "13": "Performing technical maintenance...", "14": "Disciplined work in security...", "15": "Versatile and professionally committed..." },
    de: { "1": "Fachkraft mit Führungserfahrung...", "2": "Technologieorientierter Experte...", "3": "Erfahren in präziser Administration...", "4": "Unterstützung von Vertriebsprozessen...", "5": "Kreative Lösungen und visuelle Sichtweise...", "6": "Erfahrung in Logistik und Lieferketten...", "7": "Motivierter Berufseinsteiger...", "8": "Präzise Arbeit im handwerklichen Bereich...", "9": "Bildungs- und Gesundheitswesen...", "10": "Erstklassiger Service in der Gastronomie...", "11": "Methodische Umsetzung langfristiger Ziele...", "12": "Managemententscheidungen durch Analysen...", "13": "Technische Wartung und Service...", "14": "Disziplinierte Arbeit im Bereich Sicherheit...", "15": "Vielseitiger Mitarbeiter..." }
};

const dictionary = {
    hu: { engineName: "Career-Engine", fName: "KERESZTNÉV", lName: "VEZETÉKNÉV", city: "VÁROS", street: "UTCA", phone: "TELEFON", email: "EMAIL", summaryHeader: "BEMUTATKOZÁS VÁLASZTÓ", summary: "BEMUTATKOZÁS-KÉPESSÉGEK", eduHeader: "TANULMÁNYOK", workHeader: "TAPASZTALAT", addEdu: "+ ÚJ ISKOLA", addWork: "+ ÚJ MUNKAHELY", printBtn: "PDF GENERÁLÁSA", addr: "Cím:", colors: "SZÍNEK", styles: "STÍLUSOK", select_hint: "-- HOZZÁADÁS --", menu: ["🔝 Proaktív Vezető", "💻 Tech-Guru", "🎯 Adminisztrátor", "🤝 Ügyfélmágnes", "🎨 Kreatív Vizionárius", "🚛 Logisztikai", "⚡ Junior", "🏗️ Szakmunkás", "🚑 Egészségügy / Oktatás", "💎 Hospitality / Luxus", "🚀 Stratégiai", "📉 Elemző", "🛠️ Karbantartó / Szerviz", "🛡️ Biztonság és Rend", "🌟 Általános Motivált"] },
    en: { engineName: "Career-Engine", fName: "FIRST NAME", lName: "LAST NAME", city: "CITY", street: "STREET", phone: "PHONE", email: "EMAIL", summaryHeader: "SUMMARY SELECTOR", summary: "SUMMARY-SKILLS", eduHeader: "EDUCATION", workHeader: "EXPERIENCE", addEdu: "+ ADD SCHOOL", addWork: "+ ADD JOB", printBtn: "GENERATE PDF", addr: "Address:", colors: "COLORS", styles: "STYLES", select_hint: "-- ADD --", menu: ["🔝 Proactive Leader", "💻 Tech-Guru", "🎯 Administrator", "🤝 Customer Magnet", "🎨 Creative Visionary", "🚛 Logistics", "⚡ Junior", "🏗️ Industrial Worker", "🚑 Health / Education", "💎 Hospitality / Luxury", "🚀 Strategic", "📉 Analyst", "🛠️ Technical / Service", "🛡️ Security and Order", "🌟 General Motivated"] },
    de: { engineName: "Career-Engine", fName: "VORNAME", lName: "NACHNAME", city: "STADT", street: "STRASSE", phone: "TELEFON", email: "EMAIL", summaryHeader: "PROFIL AUSWAHL", summary: "PROFIL-FÄHIGKEITEN", eduHeader: "BILDUNG", workHeader: "ERFAHRUNG", addEdu: "+ SCHULE", addWork: "+ JOB", printBtn: "PDF GENERIEREN", addr: "Adresse:", colors: "FARBEN", styles: "STILE", select_hint: "-- HINZÜFÜGEN --", menu: ["🔝 Proaktive Führungskraft", "💻 Tech-Guru", "🎯 Administrator", "🤝 Kundenmagnet", "🎨 Kreativer Visionär", "🚛 Logistik", "⚡ Junior", "🏗️ Facharbeiter", "🚑 Gesundheit / Bildung", "💎 Hospitality / Luxus", "🚀 Strategisch", "📉 Analyst", "🛠️ Technisch / Service", "🛡️ Sicherheit und Ordnung", "🌟 Allgemein Motiviert"] }
};

let currentLang = 'hu';
let selectedIndices = [];

function setMode(l, btn) {
    currentLang = l;
    document.querySelectorAll('.btn-lang').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    updateInterface();
    refreshMenu();
    updatePreview();
}

function refreshMenu() {
    const sel = document.getElementById('sel-summary');
    const d = dictionary[currentLang];
    let h = `<option value="">${d.select_hint}</option>`;
    d.menu.forEach((text, i) => h += `<option value="${i+1}">${text}</option>`);
    sel.innerHTML = h;
}

function updateInterface() {
    const d = dictionary[currentLang];
    for (let key in d) {
        const el = document.getElementById('lbl-' + key);
        if (el) el.innerText = d[key];
    }
}

function applyMatrixSummary() {
    const sel = document.getElementById('sel-summary');
    const target = document.getElementById('in-summary');
    if (sel.value) {
        selectedIndices.push(sel.value);
        target.value = selectedIndices.map(idx => summariesDB[currentLang][idx] || "").join("\n\n");
        sel.value = "";
        updatePreview();
    }
}

function addEntry(type) {
    const div = document.createElement('div');
    div.className = 'entry-box';
    div.innerHTML = `<input type="text" class="e-main" placeholder="Cím / Megnevezés" oninput="updatePreview()"><input type="text" class="e-sub" placeholder="Dátum / Időtartam" oninput="updatePreview()"><button style="position:absolute;top:5px;right:5px;background:red;color:white;border:none;cursor:pointer;" onclick="this.parentElement.remove(); updatePreview();">×</button>`;
    document.getElementById(type + '-container').appendChild(div);
}

function updatePreview() {
    const d = dictionary[currentLang];
    const l = document.getElementById('in-lastName').value || "";
    const f = document.getElementById('in-firstName').value || "";
    document.getElementById('out-name').innerText = (currentLang === 'hu' ? l + " " + f : f + " " + l).toUpperCase() || "NAME";
    
    const sTypeSelect = document.getElementById('in-street-type');
    const sType = sTypeSelect.options[sTypeSelect.selectedIndex].text.split(' / ')[currentLang === 'hu' ? 0 : (currentLang === 'en' ? 1 : 2)];

    document.getElementById('out-contact').innerHTML = `<b>${d.phone}</b> ${document.getElementById('in-phone').value}<br><b>EMAIL:</b> ${document.getElementById('in-email').value}<br><b>${d.addr}</b> ${document.getElementById('in-city').value}, ${document.getElementById('in-street').value} ${sType} ${document.getElementById('in-house').value}`;

    let html = `<h3>${d.summary}</h3><p style="white-space: pre-wrap;">${document.getElementById('in-summary').value}</p>`;
    ['edu', 'work'].forEach(type => {
        let sHtml = `<h3>${d[type + 'Header']}</h3>`;
        document.querySelectorAll('#' + type + '-container .entry-box').forEach(box => {
            const m = box.querySelector('.e-main').value;
            const sub = box.querySelector('.e-sub').value;
            if(m) sHtml += `<div style="margin-bottom:10px"><b>${m}</b> (${sub})</div>`;
        });
        html += sHtml;
    });
    document.getElementById('main-content').innerHTML = html;
}

function loadPhoto(event) {
    const reader = new FileReader();
    reader.onload = function() {
        document.getElementById('out-photo').src = reader.result;
        document.getElementById('out-photo-box').style.display = 'block';
    }
    if(event.target.files[0]) reader.readAsDataURL(event.target.files[0]);
}

window.onload = () => {
    const colors = ["#007bb5", "#e67e22", "#27ae60", "#c0392b", "#8e44ad", "#1a1a1a", "#f1c40f", "#16a085", "#d35400", "#2c3e50"];
    colors.forEach(c => {
        let b = document.createElement('div'); b.className = 'color-btn'; b.style.background = c;
        b.onclick = () => { document.documentElement.style.setProperty('--main-color', c); updatePreview(); };
        document.getElementById('color-picker').appendChild(b);
    });
    for(let i=1; i<=10; i++) {
        let b = document.createElement('button'); b.className = 'style-btn'; b.innerText = i;
        b.onclick = () => { document.body.className = 'style-' + i; updatePreview(); };
        document.getElementById('style-picker').appendChild(b);
    }
    refreshMenu();
    updateInterface();
};
</script>

</html>
