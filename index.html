<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Career-Engine v75.0 - A&N Visual</title>
    <style>
        :root { --main-color: #007bb5; --bg: #0d0d0d; }
        body { margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', sans-serif; background: #000; color: #eee; }
        .editor-side { width: 42%; padding: 25px; overflow-y: auto; background: #111; border-right: 3px solid var(--main-color); }
        .preview-side { width: 58%; background: #333; display: flex; justify-content: center; padding: 40px; overflow-y: auto; }
        .smart-label { display: block; margin-top: 15px; font-size: 11px; font-weight: bold; color: var(--main-color); text-transform: uppercase; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 4px; box-sizing: border-box; }
        .entry-box { background: #151515; padding: 15px; margin-top: 10px; border-left: 4px solid var(--main-color); border-radius: 4px; }
        .add-btn { background: #27ae60; color: white; width: 100%; padding: 12px; border: none; margin-top: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .cv-paper { width: 210mm; min-height: 297mm; background: white; padding: 40px; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
        h1#out-name { margin: 0; color: var(--main-color); font-size: 32px; }
        h3 { border-bottom: 1px solid #eee; color: var(--main-color); padding-bottom: 5px; margin-top: 25px; text-transform: uppercase; }
        @media print { .editor-side { display: none; } .preview-side { width: 100%; padding: 0; background: white; } .cv-paper { box-shadow: none; width: 100%; } }
    </style>
</head>
<body class="style-1">

<div class="editor-side">
    <h1>A&N Visual v75.0</h1>
    
    <label class="smart-label">STÍLUSVÁLTÓ</label>
    <div id="style-picker" style="display:grid; grid-template-columns: repeat(5, 1fr); gap: 5px;"></div>

    <label class="smart-label">NÉV ÉS KAPCSOLAT</label>
    <div style="display:flex; gap:10px;">
        <input type="text" id="in-lastName" placeholder="Vezetéknév" oninput="upd()">
        <input type="text" id="in-firstName" placeholder="Keresztnév" oninput="upd()">
    </div>
    <input type="text" id="in-phone" placeholder="Telefon" oninput="upd()">
    <input type="email" id="in-email" placeholder="Email" oninput="upd()">

    <label class="smart-label">BEMUTATKOZÁS VÁLASZTÓ (KORLÁTLAN)</label>
    <select onchange="addS(this.value)">
        <option value="">-- Válassz mondatot --</option>
        <option value="Precíz, megbízható munkaerő vagyok.">Megbízható</option>
        <option value="Tapasztalt szakemberként célom a fejlődés.">Tapasztalt</option>
        <option value="Gyorsan tanulok és jól alkalmazkodom.">Alkalmazkodó</option>
        <option value="Jó kommunikációs készséggel rendelkező csapatjátékos.">Csapatjátékos</option>
        <option value="Műszaki beállítottságú, kihívásokat kedvelő szakember.">Műszaki</option>
    </select>
    <textarea id="sum" rows="4" oninput="upd()"></textarea>

    <div id="edu-area"><h3>TANULMÁNYOK</h3><div id="e-list"></div><button onclick="add('e-list')" class="add-btn">+ ÚJ ISKOLA</button></div>
    <div id="work-area"><h3>TAPASZTALAT</h3><div id="w-list"></div><button onclick="add('w-list')" class="add-btn">+ ÚJ MUNKAHELY</button></div>
    
    <button onclick="window.print()" class="add-btn" style="background:var(--main-color); margin-top:20px;">PDF GENERÁLÁSA</button>
</div>

<div class="preview-side">
    <div class="cv-paper" id="paper">
        <h1 id="o-n">NAME</h1>
        <div id="o-c" style="margin-bottom:20px; font-size:14px;"></div>
        <div id="o-b"></div>
    </div>
</div>

<script>
    const data = {
        edu: ["Általános iskola", "Szakmunkásképző", "Szakközépiskola", "Gimnázium", "Technikum", "Főiskola", "Egyetem"],
        jobs: ["Raktáros", "Targoncavezető", "Sofőr", "Kőműves", "Festő", "Villanyszerelő", "Lakatos", "Hegesztő", "Adminisztrátor", "Értékesítő"]
    };

    function addS(v) { if(v) { document.getElementById('sum').value += (document.getElementById('sum').value ? '\n' : '') + v; upd(); } }

    function upd() {
        const l = document.getElementById('ln' || 'in-lastName').value, f = document.getElementById('fn' || 'in-firstName').value;
        document.getElementById('o-n').innerText = (l + " " + f).toUpperCase() || "NAME";
        document.getElementById('o-c').innerHTML = `<b>Tel:</b> ${document.getElementById('in-phone').value} | <b>Email:</b> ${document.getElementById('in-email').value}`;
        
        let h = `<h3>PROFIL</h3><p style="white-space:pre-wrap;">${document.getElementById('sum').value}</p>`;
        ['e-list', 'w-list'].forEach(id => {
            const container = document.getElementById(id); if(container.children.length > 0) {
                h += `<h3>${id === 'e-list' ? 'TANULMÁNYOK' : 'TAPASZTALAT'}</h3>`;
                Array.from(container.children).forEach(box => {
                    const inputs = box.querySelectorAll('input, select');
                    if(inputs[0].value) h += `<div style="margin-bottom:10px"><b>${inputs[0].value}</b> (${inputs[2].value})<br><small>${inputs[1].value}</small></div>`;
                });
            }
        });
        document.getElementById('o-b').innerHTML = h;
    }

    function add(id) {
        const d = document.createElement('div'); d.className = 'entry-box';
        const list = id === 'e-list' ? data.edu : data.jobs;
        let options = list.map(x => `<option value="${x}">${x}</option>`).join('');
        d.innerHTML = `
            <input type="text" placeholder="Intézmény / Cég" oninput="upd()">
            <input type="text" placeholder="Év / Időtartam" oninput="upd()">
            <select onchange="upd()"><option value="">-- Válassz típust --</option>${options}</select>
        `;
        document.getElementById(id).appendChild(d);
    }

    window.onload = () => {
        const sp = document.getElementById('style-picker');
        for(let i=1; i<=10; i++) {
            let b = document.createElement('button'); b.className = 'style-btn'; b.innerText = i;
            b.onclick = () => { document.body.className = 'style-' + i; upd(); }; sp.appendChild(b);
        }
    };
</script>
</body>
</html>
