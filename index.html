<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Career-Engine v70.0 - A&N Visual - GLOBAL MATRIX</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --main-color: #007bb5; }
        body { margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', sans-serif; background: #000; color: #eee; overflow: hidden; }
        
        .editor-side { width: 42%; padding: 25px; overflow-y: auto; background: #111; border-right: 3px solid var(--main-color); }
        /* A CSÍKGYILKOS: overflow: hidden !important */
        .preview-side { width: 58%; background: #333; display: flex; justify-content: center; padding: 40px; overflow: hidden !important; }
        
        .logo-area { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .brand-circle { width: 45px; height: 45px; background: var(--main-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; border: 2px solid #fff; font-size: 20px; }
        
        .lang-grid { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn-lang { flex: 1; padding: 12px; border: none; background: #333; color: white; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-lang.active { background: var(--main-color); box-shadow: 0 0 10px var(--main-color); }
        
        .color-grid, .style-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 5px; margin-bottom: 15px; }
        .color-btn { width: 100%; height: 30px; cursor: pointer; border-radius: 4px; border: 1px solid #444; }
        .style-btn { padding: 8px; background: #222; color: white; border: 1px solid #444; cursor: pointer; border-radius: 4px; font-weight: bold; }
        
        .smart-label { display: block; margin-top: 15px; font-size: 11px; font-weight: bold; color: var(--main-color); text-transform: uppercase; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 4px; box-sizing: border-box; }
        
        .input-group { display: flex; gap: 10px; margin-top: 5px; }
        .entry-box { background: #151515; padding: 15px; margin-top: 10px; border-left: 4px solid var(--main-color); border-radius: 4px; position: relative; }
        .add-btn { background: #27ae60; color: white; width: 100%; padding: 12px; border: none; margin-top: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .print-btn { background: var(--main-color); color: white; width: 100%; padding: 18px; border: none; margin-top: 25px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 6px; }

        .cv-paper { width: 210mm; min-height: 297mm; background: white; padding: 40px; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); box-sizing: border-box; position: relative; }
        .cv-header { display: flex; gap: 20px; border-bottom: 2px solid var(--main-color); padding-bottom: 20px; margin-bottom: 20px; }
        h1#out-name { margin: 0; color: var(--main-color); font-size: 32px; }
        h3 { border-bottom: 1px solid #eee; color: var(--main-color); padding-bottom: 5px; margin-top: 25px; text-transform: uppercase; }

        /* STÍLUSOK (1-10) */
        body.style-1 .cv-paper { border-top: 20px solid var(--main-color); }
        body.style-2 .cv-header { flex-direction: column; text-align: center; }
        body.style-3 .cv-header { flex-direction: row-reverse; }
        body.style-4 h3 { background: #f4f4f4; padding: 10px; border-left: 10px solid var(--main-color); border-bottom: none; }
        body.style-5 .cv-paper { font-family: 'Georgia', serif; }
        body.style-6 .cv-header { border-bottom: 8px double var(--main-color); }
        body.style-7 .cv-paper { background: #f9f9f9; border: 1px solid #ddd; }
        body.style-8 #out-name { letter-spacing: 5px; text-align: center; width: 100%; }
        body.style-9 .cv-header { align-items: flex-end; border-bottom-width: 5px; }
        body.style-10 .cv-paper::before { content: ''; position: absolute; top: 0; left: 0; width: 15px; height: 100%; background: var(--main-color); }

        @media print {
            .editor-side, .print-btn { display: none !important; }
            .preview-side { width: 100% !important; padding: 0 !important; background: white !important; overflow: visible !important; }
            .cv-paper { box-shadow: none !important; margin: 0 !important; width: 100% !important; border: none !important; }
            ::-webkit-scrollbar { display: none !important; }
        }
    </style>
</head>
<body class="style-1">

<div class="editor-side">
    <div class="logo-area">
        <div class="brand-circle">A&N</div>
        <h1 id="lbl-engineName">Career-Engine</h1>
    </div>

    <div class="lang-grid">
        <button class="btn-lang active" onclick="setMode('hu', this)">HU</button>
        <button class="btn-lang" onclick="setMode('en', this)">EN</button>
        <button class="btn-lang" onclick="setMode('de', this)">DE</button>
    </div>

    <label class="smart-label" id="lbl-colors">SZÍNEK</label>
    <div class="color-grid" id="color-picker"></div>

    <label class="smart-label" id="lbl-styles">STÍLUSOK</label>
    <div class="style-grid" id="style-picker"></div>

    <label class="smart-label" id="lbl-photo">FOTÓ FELTÖLTÉSE</label>
    <input type="file" onchange="loadPhoto(event)" style="margin-bottom: 15px;">

    <div class="input-group">
        <div style="flex:1">
            <label class="smart-label" id="lbl-fName">KERESZTNÉV</label>
            <input type="text" id="in-firstName" oninput="updatePreview()">
        </div>
        <div style="flex:1">
            <label class="smart-label" id="lbl-lName">VEZETÉKNÉV</label>
            <input type="text" id="in-lastName" oninput="updatePreview()">
        </div>
    </div>

    <div class="input-group">
        <div style="flex:1">
            <label class="smart-label" id="lbl-city">VÁROS</label>
            <input type="text" id="in-city" oninput="updatePreview()">
        </div>
        <div style="flex:1">
            <label class="smart-label" id="lbl-street">UTCA</label>
            <input type="text" id="in-street" oninput="updatePreview()">
        </div>
    </div>

    <div class="input-group">
        <div style="flex:1">
            <label class="smart-label">≡ TÍPUS</label>
            <select id="in-street-type" onchange="updatePreview()">
                <option value="utca">utca</option>
                <option value="út">út</option>
                <option value="tér">tér</option>
            </select>
        </div>
        <div style="width:30%">
            <label class="smart-label">HÁZSZÁM</label>
            <input type="text" id="in-house" oninput="updatePreview()">
        </div>
    </div>

    <label class="smart-label" id="lbl-phone">TELEFON</label>
    <input type="text" id="in-phone" oninput="updatePreview()">

    <label class="smart-label" id="lbl-email">EMAIL</label>
    <input type="email" id="in-email" oninput="updatePreview()">

    <label class="smart-label" id="lbl-summaryHeader">BEMUTATKOZÁS VÁLASZTÓ</label>
    <select id="sel-summary" onchange="applyMatrixSummary()" style="background: #1a3a5a; color: white; border: 1px solid #007bb5;"></select>
    <textarea id="in-summary" rows="8" oninput="updatePreview()"></textarea>

    <div id="edu-area">
        <h3 id="lbl-eduHeader">TANULMÁNYOK</h3>
        <div id="edu-container"></div>
        <button onclick="addEntry('edu')" class="add-btn" id="lbl-addEdu">+ ÚJ ISKOLA</button>
    </div>

    <div id="work-area">
        <h3 id="lbl-workHeader">TAPASZTALAT</h3>
        <div id="work-container"></div>
        <button onclick="addEntry('work')" class="add-btn" id="lbl-addWork">+ ÚJ MUNKAHELY</button>
    </div>

    <button onclick="generatePDF()" class="print-btn" id="lbl-printBtn">PDF GENERÁLÁSA</button>
</div>

<div class="preview-side">
    <div class="cv-paper" id="cv-paper">
        <div class="cv-header">
            <div id="out-photo-box" style="display:none; width:130px; height:160px; overflow:hidden; border: 1px solid #eee; margin-right: 20px;">
                <img id="out-photo" style="width:100%; height:100%; object-fit: cover;">
            </div>
            <div class="header-text">
                <h1 id="out-name">NAME</h1>
                <div id="out-contact" style="margin-top:10px; font-size:14px; color:#555;"></div>
            </div>
        </div>
        <div id="main-content"></div>
    </div>
</div>

<script src="database.js"></script>
<script>
    const summariesDB = {
        hu: { "1": "Több éves szakmai tapasztalat...", "2": "Technológiai fókusz...", "3": "Precíziós admin...", "4": "Ügyfélközpontú...", "5": "Kreatív...", "6": "Logisztikai...", "7": "Pályakezdő...", "8": "Szakipari...", "9": "Egészségügy...", "10": "Vendéglátás...", "11": "Stratégiai...", "12": "Elemző...", "13": "Karbantartó...", "14": "Biztonsági...", "15": "Motivált..." },
        en: { "1": "Experienced professional...", "2": "Tech-focused...", "3": "Precision admin...", "4": "Customer-centric...", "5": "Creative...", "6": "Logistics...", "7": "Junior...", "8": "Industrial...", "9": "Education...", "10": "Hospitality...", "11": "Strategic...", "12": "Analyst...", "13": "Technical...", "14": "Security...", "15": "Motivated..." },
        de: { "1": "Fachkraft mit Erfahrung...", "2": "Technologieorientiert...", "3": "Erfahren in Admin...", "4": "Kundenorientiert...", "5": "Kreativ...", "6": "Logistik...", "7": "Berufseinsteiger...", "8": "Handwerklich...", "9": "Gesundheitswesen...", "10": "Luxusbereich...", "11": "Strategisch...", "12": "Analyst...", "13": "Service...", "14": "Sicherheit...", "15": "Motiviert..." }
    };

    const dictionary = {
        hu: { engineName: "Career-Engine", fName: "KERESZTNÉV", lName: "VEZETÉKNÉV", city: "VÁROS", street: "UTCA", phone: "TELEFON", email: "EMAIL", summaryHeader: "BEMUTATKOZÁS VÁLASZTÓ", summary: "BEMUTATKOZÁS", eduHeader: "TANULMÁNYOK", workHeader: "TAPASZTALAT", addEdu: "+ ÚJ ISKOLA", addWork: "+ ÚJ MUNKAHELY", printBtn: "PDF GENERÁLÁSA", addr: "Cím:", colors: "SZÍNEK", styles: "STÍLUSOK", select_hint: "-- HOZZÁADÁS --", menu: ["🔝 Proaktív Vezető", "💻 Tech-Guru", "🎯 Admin", "🤝 Ügyfélmágnes", "🎨 Kreatív", "🚛 Logisztika", "⚡ Junior", "🏗️ Szakmunkás", "🚑 Egészségügy", "💎 Luxus", "🚀 Stratégiai", "📉 Elemző", "🛠️ Karbantartó", "🛡️ Biztonság", "🌟 Motivált"] },
        en: { engineName: "Career-Engine", fName: "FIRST NAME", lName: "LAST NAME", city: "CITY", street: "STREET", phone: "PHONE", email: "EMAIL", summaryHeader: "SUMMARY SELECTOR", summary: "SUMMARY", eduHeader: "EDUCATION", workHeader: "EXPERIENCE", addEdu: "+ ADD SCHOOL", addWork: "+ ADD JOB", printBtn: "GENERATE PDF", addr: "Address:", colors: "COLORS", styles: "STYLES", select_hint: "-- ADD --", menu: ["🔝 Leader", "💻 Tech", "🎯 Admin", "🤝 Customer", "🎨 Creative", "🚛 Logistics", "⚡ Junior", "🏗️ Industrial", "🚑 Health", "💎 Luxury", "🚀 Strategic", "📉 Analyst", "🛠️ Service", "🛡️ Security", "🌟 Motivated"] },
        de: { engineName: "Career-Engine", fName: "VORNAME", lName: "NACHNAME", city: "STADT", street: "STRASSE", phone: "TELEFON", email: "EMAIL", summaryHeader: "AUSWAHL", summary: "PROFIL", eduHeader: "BILDUNG", workHeader: "ERFAHRUNG", addEdu: "+ SCHULE", addWork: "+ JOB", printBtn: "PDF GENERIEREN", addr: "Adresse:", colors: "FARBEN", styles: "STILE", select_hint: "-- HINZÜFÜGEN --", menu: ["🔝 Führung", "💻 Tech", "🎯 Admin", "🤝 Kunden", "🎨 Kreativ", "🚛 Logistik", "⚡ Junior", "🏗️ Arbeiter", "🚑 Gesundheit", "💎 Luxus", "🚀 Strategisch", "📉 Analyst", "🛠️ Service", "🛡️ Sicherheit", "🌟 Motiviert"] }
    };

    let currentLang = 'hu';
    let selectedIndices = [];

    function setMode(l, btn) {
        currentLang = l;
        document.querySelectorAll('.btn-lang').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateInterface();
        refreshMenu();
        updatePreview();
    }

    function refreshMenu() {
        const sel = document.getElementById('sel-summary');
        const d = dictionary[currentLang];
        let h = `<option value="">${d.select_hint}</option>`;
        d.menu.forEach((text, i) => h += `<option value="${i+1}">${text}</option>`);
        sel.innerHTML = h;
    }

    function updateInterface() {
        const d = dictionary[currentLang];
        for (let key in d) {
            const el = document.getElementById('lbl-' + key);
            if (el && typeof d[key] === 'string') el.innerText = d[key];
        }
    }

    function applyMatrixSummary() {
        const sel = document.getElementById('sel-summary');
        if (sel.value) {
            selectedIndices.push(sel.value);
            document.getElementById('in-summary').value = selectedIndices.map(idx => summariesDB[currentLang][idx]).join("\n\n");
            sel.value = "";
            updatePreview();
        }
    }

    function addEntry(type) {
        const div = document.createElement('div');
        div.className = 'entry-box';
        div.innerHTML = `<input type="text" class="e-main" placeholder="Megnevezés" oninput="updatePreview()"><input type="text" class="e-sub" placeholder="Idő" oninput="updatePreview()"><button style="position:absolute;top:5px;right:5px;background:red;color:white;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;" onclick="this.parentElement.remove(); updatePreview();">×</button>`;
        document.getElementById(type + '-container').appendChild(div);
    }

    function updatePreview() {
        const d = dictionary[currentLang];
        const l = document.getElementById('in-lastName').value;
        const f = document.getElementById('in-firstName').value;
        document.getElementById('out-name').innerText = (currentLang === 'hu' ? l + " " + f : f + " " + l).toUpperCase() || "NAME";
        
        const phone = document.getElementById('in-phone').value;
        const email = document.getElementById('in-email').value;
        const city = document.getElementById('in-city').value;
        const street = document.getElementById('in-street').value;
        const house = document.getElementById('in-house').value;
        
        document.getElementById('out-contact').innerHTML = `<b>${d.phone}</b> ${phone} | <b>EMAIL:</b> ${email}<br><b>${d.addr}</b> ${city}, ${street} ${house}`;

        let html = `<h3>${d.summary}</h3><p style="white-space: pre-wrap;">${document.getElementById('in-summary').value}</p>`;
        ['edu', 'work'].forEach(type => {
            html += `<h3>${dictionary[currentLang][type + 'Header']}</h3>`;
            document.querySelectorAll('#' + type + '-container .entry-box').forEach(box => {
                const m = box.querySelector('.e-main').value;
                const s = box.querySelector('.e-sub').value;
                if(m) html += `<div style="margin-bottom:10px"><b>${m}</b> (${s})</div>`;
            });
        });
        document.getElementById('main-content').innerHTML = html;
    }

    function loadPhoto(event) {
        const reader = new FileReader();
        reader.onload = () => {
            document.getElementById('out-photo').src = reader.result;
            document.getElementById('out-photo-box').style.display = 'block';
            updatePreview();
        };
        if(event.target.files[0]) reader.readAsDataURL(event.target.files[0]);
    }

    function generatePDF() {
        updatePreview();
        window.scrollTo(0,0);
        setTimeout(() => { window.print(); }, 300);
    }

    window.onload = () => {
        const colors = ["#007bb5", "#e67e22", "#27ae60", "#c0392b", "#8e44ad", "#1a1a1a", "#f1c40f", "#16a085", "#d35400", "#2c3e50"];
        colors.forEach(c => {
            let b = document.createElement('div'); b.className = 'color-btn'; b.style.background = c;
            b.onclick = () => { document.documentElement.style.setProperty('--main-color', c); updatePreview(); };
            document.getElementById('color-picker').appendChild(b);
        });
        for(let i=1; i<=10; i++) {
            let b = document.createElement('button'); b.className = 'style-btn'; b.innerText = i;
            b.onclick = () => { document.body.className = 'style-' + i; updatePreview(); };
            document.getElementById('style-picker').appendChild(b);
        }
        refreshMenu();
        updateInterface();
    };
</script>
</body>
</html>
