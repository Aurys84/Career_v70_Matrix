<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Career-Engine v70.0 - A&N Visual</title>
    <style>
        :root { --main-color: #007bb5; --bg: #0d0d0d; }
        body { margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', sans-serif; background: #000; color: #eee; }
        .editor-side { width: 42%; padding: 25px; overflow-y: auto; background: #111; border-right: 3px solid var(--main-color); }
        .preview-side { width: 58%; background: #333; display: flex; justify-content: center; padding: 40px; overflow-y: auto; }
        .smart-label { display: block; margin-top: 15px; font-size: 11px; font-weight: bold; color: var(--main-color); text-transform: uppercase; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 4px; box-sizing: border-box; }
        .entry-box { background: #151515; padding: 15px; margin-top: 10px; border-left: 4px solid var(--main-color); border-radius: 4px; }
        .add-btn { background: #27ae60; color: white; width: 100%; padding: 12px; border: none; margin-top: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .print-btn { background: var(--main-color); color: white; width: 100%; padding: 18px; border: none; margin-top: 25px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 6px; }
        .cv-paper { width: 210mm; min-height: 297mm; background: white; padding: 40px; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); box-sizing: border-box; position: relative; }
        h1#out-name { margin: 0; color: var(--main-color); font-size: 32px; }
        h3 { border-bottom: 1px solid #eee; color: var(--main-color); padding-bottom: 5px; margin-top: 25px; text-transform: uppercase; }
        
        body.style-1 .cv-paper { border-top: 20px solid var(--main-color); }
        body.style-2 .cv-header { text-align: center; }
        body.style-10 .cv-paper::before { content: ''; position: absolute; top: 0; left: 0; width: 10px; height: 100%; background: var(--main-color); }
        @media print { .editor-side { display: none; } .preview-side { width: 100%; padding: 0; background: white; } .cv-paper { box-shadow: none; width: 100%; } }
    </style>
</head>
<body class="style-1">

<div class="editor-side">
    <h1>A&N Visual Engine</h1>
    <div id="style-picker" style="display:grid; grid-template-columns: repeat(5, 1fr); gap: 5px;"></div>

    <label class="smart-label">NÉV</label>
    <input type="text" id="in-lastName" placeholder="Vezetéknév" oninput="updatePreview()">
    <input type="text" id="in-firstName" placeholder="Keresztnév" oninput="updatePreview()">

    <label class="smart-label">ATS PROFIL (MAX 3)</label>
    <select onchange="addSum(this.value)">
        <option value="">-- Válassz --</option>
        <option value="Precíz, megbízható munkaerő vagyok, aki hosszú távú munkalehetőséget keres.">Megbízható</option>
        <option value="Gyorsan tanulok és kiválóan alkalmazkodom az új munkakörnyezethez.">Alkalmazkodó</option>
        <option value="Tapasztalt szakemberként célom a csapat hatékony támogatása.">Tapasztalt</option>
    </select>
    <textarea id="in-summary" rows="4" oninput="updatePreview()"></textarea>

    <div id="edu-area"><h3>TANULMÁNYOK</h3><div id="edu-container"></div><button onclick="addEntry('edu')" class="add-btn">+ ÚJ ISKOLA</button></div>
    <div id="work-area"><h3>TAPASZTALAT</h3><div id="work-container"></div><button onclick="addEntry('work')" class="add-btn">+ ÚJ MUNKAHELY</button></div>
    <button onclick="window.print()" class="print-btn">PDF GENERÁLÁSA</button>
</div>

<div class="preview-side"><div class="cv-paper" id="cv-paper"><h1 id="out-name">NAME</h1><div id="main-content"></div></div></div>

<script>
    function addSum(v) {
        const t = document.getElementById('in-summary');
        if(v && t.value.split('\n').filter(x=>x).length < 3) { t.value += (t.value ? '\n' : '') + v; }
        updatePreview();
    }
    function updatePreview() {
        const l = document.getElementById('in-lastName').value, f = document.getElementById('in-firstName').value;
        document.getElementById('out-name').innerText = (l + " " + f).toUpperCase() || "NAME";
        let h = `<h3>PROFIL</h3><p style="white-space:pre-wrap;">${document.getElementById('in-summary').value}</p>`;
        ['edu', 'work'].forEach(id => {
            const c = document.getElementById(id + '-container'); if(c.children.length > 0) {
                h += `<h3>${id === 'edu' ? 'TANULMÁNYOK' : 'TAPASZTALAT'}</h3>`;
                Array.from(c.children).forEach(b => {
                    const i = b.querySelectorAll('input'); if(i[0].value) h += `<div><b>${i[0].value}</b> - ${i[1].value}</div>`;
                });
            }
        });
        document.getElementById('main-content').innerHTML = h;
    }
    function addEntry(t) {
        const d = document.createElement('div'); d.className = 'entry-box';
        d.innerHTML = `<input type="text" placeholder="Megnevezés" oninput="updatePreview()"><input type="text" placeholder="Év" oninput="updatePreview()">`;
        document.getElementById(t + '-container').appendChild(d);
    }
    window.onload = () => {
        const p = document.getElementById('style-picker');
        for(let i=1; i<=10; i++) {
            let b = document.createElement('button'); b.className = 'style-btn'; b.innerText = i;
            b.onclick = () => { document.body.className = 'style-' + i; updatePreview(); }; p.appendChild(b);
        }
    };
</script>
</body>
</html>
