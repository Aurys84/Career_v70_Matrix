<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Career-Engine v71 PRO - A&N Visual</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --main-color: #007bb5; }
        body { margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', sans-serif; background: #000; color: #eee; overflow: hidden; }
        .editor-side { width: 42%; padding: 25px; overflow-y: auto; background: #111; border-right: 3px solid var(--main-color); }
        .preview-side { width: 58%; background: #333; display: flex; justify-content: center; padding: 40px; overflow: hidden !important; }
        .smart-label { display: block; margin-top: 15px; font-size: 11px; font-weight: bold; color: var(--main-color); text-transform: uppercase; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 4px; box-sizing: border-box; }
        .color-btn { width: 30px; height: 30px; cursor: pointer; border-radius: 4px; display: inline-block; margin: 2px; border: 1px solid #444; }
        .print-btn { background: var(--main-color); color: white; width: 100%; padding: 18px; border: none; cursor: pointer; font-weight: bold; margin-top: 25px; border-radius: 6px; width: 100%; }
        .cv-paper { width: 210mm; min-height: 297mm; background: white; padding: 40px; color: #333; box-sizing: border-box; position: relative; }
        h1#out-name { margin: 0; color: var(--main-color); font-size: 32px; }
    </style>
</head>
<body>

<div class="editor-side">
    <div style="display: flex; gap: 8px; margin-bottom: 20px;">
        <button onclick="alert('Nyelv váltás...')">HU</button>
        <button onclick="alert('Language switch...')">EN</button>
        <button onclick="alert('Sprachwechsel...')">DE</button>
    </div>
    <h1 style="color: var(--main-color);">Career-Engine</h1>
    <div id="color-picker"></div>
    <label class="smart-label">KERESZTNÉV</label>
    <input type="text" id="in-fName" oninput="update()">
    <label class="smart-label">VEZETÉKNÉV</label>
    <input type="text" id="in-lName" oninput="update()">
    <label class="smart-label">BEMUTATKOZÁS</label>
    <textarea id="in-summary" rows="8" oninput="update()"></textarea>
    <button onclick="exportPDF()" class="print-btn">EXPORT V71 PRO</button>
</div>

<div class="preview-side">
    <div class="cv-paper" id="cv-paper">
        <h1 id="out-name">NAME</h1>
        <div id="out-summary" style="white-space: pre-wrap; margin-top: 20px;"></div>
    </div>
</div>

<script>
    // 1. SW-GYILKOS: Eltávolít minden beragadt folyamatot indításkor
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
            for(let registration of registrations) { registration.unregister(); }
        });
    }

    function update() {
        const f = document.getElementById('in-fName').value;
        const l = document.getElementById('in-lName').value;
        document.getElementById('out-name').innerText = (l + " " + f).toUpperCase() || "NAME";
        document.getElementById('out-summary').innerText = document.getElementById('in-summary').value;
    }

    async function exportPDF() {
        const { jsPDF } = window.jspdf;
        const canvas = await html2canvas(document.getElementById('cv-paper'), {scale: 2});
        const pdf = new jsPDF('p', 'mm', 'a4');
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 210, 297);
        pdf.save('Career-Engine-V71.pdf');
    }

    window.onload = () => {
        const colors = ["#007bb5", "#e67e22", "#27ae60", "#c0392b", "#8e44ad"];
        colors.forEach(c => {
            let b = document.createElement('div'); b.className = 'color-btn'; b.style.background = c;
            b.onclick = () => { document.documentElement.style.setProperty('--main-color', c); };
            document.getElementById('color-picker').appendChild(b);
        });
    };
</script>
</body>
</html>
