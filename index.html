<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Career-Engine v75.0 - A&N Visual</title>
    <style>
        :root { --main-color: #007bb5; --bg: #0d0d0d; }
        body { margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', sans-serif; background: #000; color: #eee; }
        .editor-side { width: 42%; padding: 25px; overflow-y: auto; background: #111; border-right: 3px solid var(--main-color); }
        .preview-side { width: 58%; background: #333; display: flex; justify-content: center; padding: 40px; overflow-y: auto; }
        .logo-area { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .brand-circle { width: 45px; height: 45px; background: var(--main-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; border: 2px solid #fff; font-size: 20px; }
        .info-panel { background: #1a3a5a; padding: 15px; border-radius: 8px; margin-bottom: 12px; border-left: 5px solid #f1c40f; font-size: 13px; }
        .lang-grid { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn-lang { flex: 1; padding: 12px; border: none; background: #333; color: white; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-lang.active { background: var(--main-color); box-shadow: 0 0 10px var(--main-color); }
        .color-grid, .style-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 5px; }
        .color-btn { width: 100%; height: 30px; cursor: pointer; border-radius: 4px; border: 1px solid #444; }
        .style-btn { padding: 8px; background: #222; color: white; border: 1px solid #444; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .smart-label { display: block; margin-top: 15px; font-size: 11px; font-weight: bold; color: var(--main-color); text-transform: uppercase; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 4px; box-sizing: border-box; }
        .input-group { display: flex; gap: 10px; }
        .entry-box { background: #151515; padding: 15px; margin-top: 10px; border-left: 4px solid var(--main-color); border-radius: 4px; }
        .add-btn { background: #27ae60; color: white; width: 100%; padding: 12px; border: none; margin-top: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .print-btn { background: var(--main-color); color: white; width: 100%; padding: 18px; border: none; margin-top: 25px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 6px; }
        
        .cv-paper { width: 210mm; min-height: 297mm; background: white; padding: 40px; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); box-sizing: border-box; position: relative; }
        .cv-header { display: flex; gap: 20px; border-bottom: 2px solid var(--main-color); padding-bottom: 20px; margin-bottom: 20px; }
        #out-photo { width: 130px; height: 160px; object-fit: cover; border: 1px solid #ccc; }
        h1#out-name { margin: 0; color: var(--main-color); font-size: 32px; }
        h3 { border-bottom: 1px solid #eee; color: var(--main-color); padding-bottom: 5px; margin-top: 25px; text-transform: uppercase; }

        /* A 10 STÍLUS */
        body.style-1 .cv-paper { border-top: 20px solid var(--main-color); }
        body.style-2 .cv-header { flex-direction: column; text-align: center; align-items: center; }
        body.style-3 .cv-header { flex-direction: row-reverse; }
        body.style-10 .cv-paper::before { content: ''; position: absolute; top: 0; left: 0; width: 10px; height: 100%; background: var(--main-color); }

        @media print { .editor-side { display: none; } .preview-side { width: 100%; padding: 0; background: white; } .cv-paper { box-shadow: none; width: 100%; } }
    </style>
</head>
<body class="style-1">

<div class="editor-side">
    <div class="logo-area"><div class="brand-circle">A&N</div><h1 id="lbl-engineName">Career-Engine</h1></div>
    
    <div class="lang-grid">
        <button class="btn-lang active" onclick="setMode('hu', this)">HU</button>
        <button class="btn-lang" onclick="setMode('en', this)">EN</button>
        <button class="btn-lang" onclick="setMode('de', this)">DE</button>
    </div>

    <div class="picker-row"><label class="smart-label" id="lbl-colors">SZÍNEK</label><div class="color-grid" id="color-picker"></div></div>
    <div class="picker-row"><label class="smart-label" id="lbl-styles">STÍLUSOK</label><div class="style-grid" id="style-picker"></div></div>

    <label class="smart-label" id="lbl-photo">FOTÓ</label><input type="file" onchange="loadPhoto(event)">

    <div class="input-group">
        <div style="flex:1"><label class="smart-label" id="lbl-fName">KERESZTNÉV</label><input type="text" id="in-firstName" oninput="updatePreview()"></div>
        <div style="flex:1"><label class="smart-label" id="lbl-lName">VEZETÉKNÉV</label><input type="text" id="in-lastName" oninput="updatePreview()"></div>
    </div>

    <div class="input-group">
        <div style="flex:1"><label class="smart-label" id="lbl-city">VÁROS</label><input type="text" id="in-city" oninput="updatePreview()"></div>
        <div style="flex:1"><label class="smart-label" id="lbl-street">UTCA</label><input type="text" id="in-street" oninput="updatePreview()"></div>
    </div>

    <div class="input-group">
        <div style="flex:1"><label class="smart-label" id="lbl-type">≡ TÍPUS</label>
            <select id="in-street-type" onchange="updatePreview()">
                <option value="utca">utca / street / straße</option>
                <option value="út">út / road / straße</option>
                <option value="tér">tér / square / platz</option>
            </select>
        </div>
        <div style="width:30%"><label class="smart-label">HÁZSZÁM</label><input type="text" id="in-house" oninput="updatePreview()"></div>
    </div>

    <label class="smart-label" id="lbl-phone">TELEFON</label><input type="text" id="in-phone" oninput="updatePreview()">
    <label class="smart-label" id="lbl-email">EMAIL</label><input type="email" id="in-email" oninput="updatePreview()">

    <label class="smart-label">GYORS PROFIL VÁLASZTÓ (KORLÁTLAN)</label>
    <select id="sel-summary" onchange="addSum(this.value)">
        <option value="">-- Válassz összefűzhető mondatokat --</option>
        <optgroup label="Tapasztalt">
            <option value="Precíz, megbízható munkaerő vagyok, aki hosszú távú munkalehetőséget keres.">Megbízható szakember</option>
            <option value="Tapasztalt szakemberként célom a csapat hatékony támogatása.">Tapasztalt specialista</option>
            <option value="Szakmai pályafutásom során bizonyítottam problémamegoldó képességemet.">Problémamegoldó</option>
        </optgroup>
        <optgroup label="Hozzáállás">
            <option value="Jó kommunikációs készséggel rendelkező, csapatjátékos személyiség vagyok.">Csapatjátékos</option>
            <option value="Gyorsan tanulok és kiválóan alkalmazkodom az új munkakörnyezethez.">Alkalmazkodó</option>
            <option value="Szakmám iránt elkötelezett vagyok, megbízhatóságomra bármikor lehet alapozni.">Megbízható pillér</option>
        </optgroup>
    </select>
    <textarea id="in-summary" rows="3" oninput="updatePreview()"></textarea>

    <div id="edu-area"><h3 id="lbl-eduHeader">TANULMÁNYOK</h3><div id="edu-container"></div><button onclick="addEntry('edu')" class="add-btn" id="lbl-addEdu">+ ÚJ ISKOLA</button></div>
    <div id="work-area"><h3 id="lbl-workHeader">TAPASZTALAT</h3><div id="work-container"></div><button onclick="addEntry('work')" class="add-btn" id="lbl-addWork">+ ÚJ MUNKAHELY</button></div>

    <button onclick="window.print()" class="print-btn" id="lbl-printBtn">PDF GENERÁLÁSA</button>
</div>

<div class="preview-side">
    <div class="cv-paper" id="cv-paper">
        <div class="cv-header">
            <div id="out-photo-box" style="display:none; width:130px; height:160px; overflow:hidden;"><img id="out-photo" style="width:100%;"></div>
            <div class="header-text"><h1 id="out-name">NAME</h1><div id="out-contact" style="margin-top:10px; font-size:14px; color:#555;"></div></div>
        </div>
        <div id="main-content"></div>
    </div>
</div>

<script>
    // BEÉPÍTETT ADATBÁZIS (Nincs szükség database.js-re)
    const careerDB = {
        eduLevels: [{hu:"Általános iskola", en:"Elementary School", de:"Grundschule"}, {hu:"Gimnázium", en:"High School", de:"Gymnasium"}, {hu:"Technikum", en:"Technical School", de:"Technikum"}, {hu:"Egyetem", en:"University", de:"Universität"}],
        jobs: [{hu:"Raktáros", en:"Warehouse Worker", de:"Lagerarbeiter"}, {hu:"Targoncás", en:"Forklift Driver", de:"Staplerfahrer"}, {hu:"Adminisztrátor", en:"Administrator", de:"Administrator"}],
        positions: [{hu:"Beosztott", en:"Employee", de:"Angestellter"}, {hu:"Csoportvezető", en:"Team Leader", de:"Teamleiter"}]
    };

    const dictionary = {
        hu: { engineName: "Career-Engine", fName: "KERESZTNÉV", lName: "VEZETÉKNÉV", city: "VÁROS", street: "UTCA", phone: "TELEFON", email: "EMAIL", eduHeader: "TANULMÁNYOK", workHeader: "TAPASZTALAT", addEdu: "+ ÚJ ISKOLA", addWork: "+ ÚJ MUNKAHELY", printBtn: "PDF GENERÁLÁSA", v_deg: "Végzettség", v_job: "Foglalkozás", v_pos: "Beosztás", select_hint: "-- VÁLASSZ --" },
        en: { engineName: "Career-Engine", fName: "FIRST NAME", lName: "LAST NAME", city: "CITY", street: "STREET", phone: "PHONE", email: "EMAIL", eduHeader: "EDUCATION", workHeader: "EXPERIENCE", addEdu: "+ ADD SCHOOL", addWork: "+ ADD JOB", printBtn: "GENERATE PDF", v_deg: "Degree", v_job: "Occupation", v_pos: "Position", select_hint: "-- SELECT --" },
        de: { engineName: "Career-Engine", fName: "VORNAME", lName: "NACHNAME", city: "STADT", street: "STRASSE", phone: "TELEFON", email: "EMAIL", eduHeader: "BILDUNG", workHeader: "ERFAHRUNG", addEdu: "+ SCHULE", addWork: "+ JOB", printBtn: "PDF GENERIEREN", v_deg: "Abschluss", v_job: "Beruf", v_pos: "Position", select_hint: "-- WÄHLEN --" }
    };

    let currentLang = 'hu';

    function addSum(v) { if(v) { document.getElementById('in-summary').value += (document.getElementById('in-summary').value ? '\n' : '') + v; updatePreview(); } }

    function setMode(l, btn) {
        currentLang = l;
        document.querySelectorAll('.btn-lang').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateInterface(); updatePreview();
    }

    function updateInterface() {
        const d = dictionary[currentLang];
        for (let key in d) { const el = document.getElementById('lbl-' + key); if (el) el.innerText = d[key]; }
    }

    function updatePreview() {
        const l = document.getElementById('in-lastName').value || "";
        const f = document.getElementById('in-firstName').value || "";
        document.getElementById('out-name').innerText = (currentLang === 'hu' ? l + " " + f : f + " " + l).trim().toUpperCase() || "NAME";
        
        const city = document.getElementById('in-city').value;
        const street = document.getElementById('in-street').value;
        const sType = document.getElementById('in-street-type').options[document.getElementById('in-street-type').selectedIndex].text;
        
        document.getElementById('out-contact').innerHTML = `
            <b>Tel:</b> ${document.getElementById('in-phone').value} | <b>Email:</b> ${document.getElementById('in-email').value}<br>
            <b>Cím:</b> ${city}, ${street} ${sType} ${document.getElementById('in-house').value}
        `;

        let html = `<h3>PROFIL</h3><p style="white-space:pre-wrap;">${document.getElementById('in-summary').value}</p>`;
        ['edu', 'work'].forEach(t => {
            const container = document.getElementById(t + '-container');
            if(container.children.length > 0) {
                html += `<h3>${dictionary[currentLang][t==='edu'?'eduHeader':'workHeader']}</h3>`;
                Array.from(container.children).forEach(box => {
                    const inputs = box.querySelectorAll('input, select');
                    if(inputs[0].value) html += `<div style="margin-bottom:10px"><b>${inputs[0].value}</b><br><small>${inputs[2].options[inputs[2].selectedIndex]?.text || ''} - ${inputs[1].value}</small></div>`;
                });
            }
        });
        document.getElementById('main-content').innerHTML = html;
    }

    function addEntry(type) {
        const div = document.createElement('div'); div.className = 'entry-box';
        const d = dictionary[currentLang];
        if(type === 'edu') {
            div.innerHTML = `<input type="text" placeholder="Iskola" oninput="updatePreview()"><input type="text" placeholder="Év" oninput="updatePreview()">
                             <label class="smart-label">${d.v_deg}</label><select onchange="updatePreview()">${getOptions(careerDB.eduLevels)}</select>`;
        } else {
            div.innerHTML = `<input type="text" placeholder="Cég" oninput="updatePreview()"><input type="text" placeholder="Időtartam" oninput="updatePreview()">
                             <label class="smart-label">${d.v_job}</label><select onchange="updatePreview()">${getOptions(careerDB.jobs)}</select>`;
        }
        document.getElementById(type + '-container').appendChild(div);
    }

    function getOptions(list) {
        return `<option value="">${dictionary[currentLang].select_hint}</option>` + list.map(x => `<option value="${x.hu}">${x[currentLang]}</option>`).join('');
    }

    window.onload = () => {
        const cp = document.getElementById('color-picker');
        ["#007bb5", "#e67e22", "#27ae60", "#c0392b", "#8e44ad", "#1a1a1a"].forEach(c => {
            let b = document.createElement('div'); b.className = 'color-btn'; b.style.background = c;
            b.onclick = () => { document.documentElement.style.setProperty('--main-color', c); updatePreview(); }; cp.appendChild(b);
        });
        const sp = document.getElementById('style-picker');
        for(let i=1; i<=10; i++) {
            let b = document.createElement('button'); b.className = 'style-btn'; b.innerText = i;
            b.onclick = () => { document.body.className = 'style-' + i; updatePreview(); }; sp.appendChild(b);
        }
        updateInterface();
    };

    function loadPhoto(e) {
        const r = new FileReader();
        r.onload = () => { document.getElementById('out-photo').src = r.result; document.getElementById('out-photo-box').style.display='block'; updatePreview(); };
        r.readAsDataURL(e.target.files[0]);
    }
</script>
</body>
</html>
