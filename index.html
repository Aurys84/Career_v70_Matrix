<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Career-Engine v69.0 - A&N Visual</title>
    <style>
        :root { --main-color: #007bb5; --bg: #0d0d0d; }
        body { margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', sans-serif; background: #000; color: #eee; }
        .editor-side { width: 42%; padding: 25px; overflow-y: auto; background: #111; border-right: 3px solid var(--main-color); }
        .preview-side { width: 58%; background: #333; display: flex; justify-content: center; padding: 40px; overflow-y: auto; }
        .logo-area { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .brand-circle { width: 45px; height: 45px; background: var(--main-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; border: 2px solid #fff; font-size: 20px; }
        .info-panel { background: #1a3a5a; padding: 15px; border-radius: 8px; margin-bottom: 12px; border-left: 5px solid #f1c40f; font-size: 13px; }
        .lang-grid { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn-lang { flex: 1; padding: 12px; border: none; background: #333; color: white; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-lang.active { background: var(--main-color); box-shadow: 0 0 10px var(--main-color); }
        .picker-row { margin-bottom: 15px; }
        .color-grid, .style-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 5px; }
        .color-btn { width: 100%; height: 30px; cursor: pointer; border-radius: 4px; border: 1px solid #444; }
        .style-btn { padding: 8px; background: #222; color: white; border: 1px solid #444; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .smart-label { display: block; margin-top: 15px; font-size: 11px; font-weight: bold; color: var(--main-color); text-transform: uppercase; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 4px; box-sizing: border-box; }
        .input-group { display: flex; gap: 10px; }
        .entry-box { background: #151515; padding: 15px; margin-top: 10px; border-left: 4px solid var(--main-color); border-radius: 4px; }
        .add-btn { background: #27ae60; color: white; width: 100%; padding: 12px; border: none; margin-top: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .print-btn { background: var(--main-color); color: white; width: 100%; padding: 18px; border: none; margin-top: 25px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 6px; }
        
        /* ALAP PAPÍR DESIGN */
        .cv-paper { width: 210mm; min-height: 297mm; background: white; padding: 40px; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); box-sizing: border-box; position: relative; }
        .cv-header { display: flex; gap: 20px; border-bottom: 2px solid var(--main-color); padding-bottom: 20px; margin-bottom: 20px; }
        #out-photo { width: 130px; height: 160px; object-fit: cover; border: 1px solid #ccc; }
        h1#out-name { margin: 0; color: var(--main-color); font-size: 32px; }
        h3 { border-bottom: 1px solid #eee; color: var(--main-color); padding-bottom: 5px; margin-top: 25px; text-transform: uppercase; }

        /* A 10 STÍLUS KŐKEMÉNY FIXÁLÁSA */
        body.style-1 .cv-paper { border-top: 20px solid var(--main-color); }
        body.style-2 .cv-header { flex-direction: column; text-align: center; align-items: center; }
        body.style-3 .cv-header { flex-direction: row-reverse; }
        body.style-4 h3 { background: #f4f4f4; padding: 10px; border-left: 10px solid var(--main-color); border-bottom: none; }
        body.style-5 .cv-paper { font-family: 'Georgia', serif; }
        body.style-6 .cv-header { border-bottom: 10px double var(--main-color); }
        body.style-7 .cv-paper { background: #fafafa; border: 1px solid #ddd; }
        body.style-8 #out-name { letter-spacing: 8px; text-align: center; width: 100%; }
        body.style-9 .cv-header { align-items: flex-end; border-bottom-width: 5px; }
        body.style-10 .cv-paper::before { content: ''; position: absolute; top: 0; left: 0; width: 10px; height: 100%; background: var(--main-color); }

        @media print { .editor-side { display: none; } .preview-side { width: 100%; padding: 0; background: white; } .cv-paper { box-shadow: none; width: 100%; } }
    </style>
</head>
<body class="style-1">

    <div class="input-group">

        <div style="flex:1"><label class="smart-label" id="lbl-lName">VEZETÉKNÉV / LAST NAME / NACHNAME</label><input type="text" id="in-lastName" oninput="updatePreview()"></div>
    </div>

    <div class="input-group">
        <div style="flex:1"><label class="smart-label" id="lbl-city">VÁROS / CITY / STADT</label><input type="text" id="in-city" oninput="updatePreview()"></div>
        <div style="flex:1"><label class="smart-label" id="lbl-street">UTCA / STREET / STRASSE</label><input type="text" id="in-street" oninput="updatePreview()"></div>
    </div>
    <div class="input-group">
        <div style="flex:1"><label class="smart-label" id="lbl-type">≡ TÍPUS</label>
            <select id="in-street-type" onchange="updatePreview()">
                <option value="utca">utca / street / straße</option>
                <option value="út">út / road / straße</option>
                <option value="tér">tér / square / platz</option>
            </select>
        </div>
        <div style="width:30%"><label class="smart-label">HÁZSZÁM</label><input type="text" id="in-house" oninput="updatePreview()"></div>
    </div>

    <label class="smart-label" id="lbl-phone">TELEFON / PHONE / TELEFON</label><input type="text" id="in-phone" oninput="updatePreview()">
    <label class="smart-label" id="lbl-email">EMAIL</label><input type="email" id="in-email" oninput="updatePreview()">
   <label class="smart-label" id="lbl-summary">BEMUTATKOZÁS VÁLASZTÓ (15 OPCIÓ - NINCS KORLÁT)</label>
<select id="sel-summary" onchange="applyMatrixSummary()" style="border: 1px solid #007bb5; background: #1a3a5a;">
    <option value="">-- Válassz / Select / Wählen --</option>
    <option value="1">🔝 Proaktív Vezető (Management)</option>
    <option value="2">💻 Tech-Guru (IT / Fejlesztő)</option>
    <option value="3">🎯 Precíz Adminisztrátor (Office)</option>
    <option value="4">🤝 Ügyfélmágnes (Sales / Customer Care)</option>
    <option value="5">🎨 Kreatív Vizionárius (Design / Marketing)</option>
    <option value="6">🚛 Logisztikai Nindzsa (Szállítás / Raktár)</option>
    <option value="7">⚡ Gyorsan Tanuló Junior (Pályakezdő)</option>
    <option value="8">🏗️ Megbízható Szakmunkás (Ipar)</option>
    <option value="9">🚑 Gondoskodó Profi (Egészségügy / Oktatás)</option>
    <option value="10">💎 Luxus / Hospitality (Vendéglátás)</option>
    <option value="11">🚀 Stratégiai Gondolkodó (Business)</option>
    <option value="12">📉 Elemző Zseni (Finance / Data)</option>
    <option value="13">🛠️ Karbantartó / Szerviz (Technical)</option>
    <option value="14">🛡️ Biztonság és Rend (Security)</option>
    <option value="15">🌟 Általános Motivált (Universal)</option>
</select>
<textarea id="in-summary" rows="5" oninput="updatePreview()" placeholder="Válassz fent..."></textarea>
    <div id="edu-area"><h3 id="lbl-eduHeader">TANULMÁNYOK</h3><div id="edu-container"></div><button onclick="addEntry('edu')" class="add-btn" id="lbl-addEdu">+ ÚJ ISKOLA</button></div>
    <div id="work-area"><h3 id="lbl-workHeader">MUNKATAPASZTALAT</h3><div id="work-container"></div><button onclick="addEntry('work')" class="add-btn" id="lbl-addWork">+ ÚJ MUNKAHELY</button></div>

    <button onclick="window.print()" class="print-btn" id="lbl-printBtn">PDF GENERÁLÁSA</button>
</div>

<div class="preview-side"><div class="cv-paper" id="cv-paper"><div class="cv-header"><div id="out-photo-box" style="display:none; width:130px; height:160px; overflow:hidden;"><img id="out-photo" style="width:100%;"></div><div class="header-text"><h1 id="out-name">NAME</h1><div id="out-contact" style="margin-top:10px; font-size:14px; color:#555;"></div></div></div><div id="main-content"></div></div></div>

<script>
// 1. HIVATALOS BEMUTATKOZÓ ADATBÁZIS (15 OPCIÓ, 3 NYELV - API KILŐVE)
const summaryDB = {

        "4": "Ügyfélközpontú szemléletmódommal hatékonyan támogatom a hosszú távú üzleti kapcsolatok építését.",
        "5": "Kreatív szakemberként a vizuális kommunikáció és a márkaépítés területén nyújtok professzionális támogatást.",

        "7": "Elkötelezett és fejlődésorientált pályakezdőként felelősségteljes munkavégzéssel keresem a szakmai kihívásokat.",
        "8": "Nagy munkabírású, megbízható szakmunkásként a minőségi és pontos ipari kivitelezésre törekszem.",
        "9": "Empatikus szakemberként munkám során a szakmai protokollok szigorú betartására és a magas szintű ellátásra törekszem.",
        "10": "A prémium vendéglátásban szerzett tapasztalataimat a reprezentatív ügyfélélmény biztosításának szolgálatába állítom.",
        "11": "Stratégiai látásmódom segíti a komplex üzleti folyamatok átlátását és a hatékony döntéselőkészítést.",
        "12": "Pénzügyi és adatelemzési területen mozgok otthonosan, támogatva az adatvezérelt döntéshozatalt.",
        "13": "Műszaki orientációjú szakemberként a rendszerek üzemeltetése és a hibaelhárítás alkotja szakterületem magját.",
        "14": "Felelősségteljes és fegyelmezett munkavégzés jellemzi pályafutásomat a biztonsági előírások mentén.",
        "15": "Sokoldalú és szakmailag elkötelezett munkatárs vagyok, kiemelkedő alkalmazkodóképességgel."
    },
    en: {
        "1": "Professional with several years of relevant management experience. My strengths include strategic planning and result-oriented leadership.",
        "2": "Tech-focused professional committed to innovative solutions and efficient problem-solving.",
        "3": "Characterized by precision and a systematic approach in managing administrative and corporate documentation.",
        "4": "Supporting long-term business relationships through a customer-centric mindset and professional management.",
        "5": "Creative professional providing support in visual communication and branding with functional efficiency.",
        "6": "Expert in logistical processes and operational efficiency with quick decision-making abilities.",
        "7": "Growth-oriented entry-level professional characterized by quick learning and a responsible work ethic.",
        "8": "Reliable skilled worker with high stamina striving for quality and precise industrial execution.",
        "9": "Empathetic professional committed to strict adherence to professional protocols and high-level care.",
        "10": "Applying premium hospitality experience to ensure the highest level of representative client experience.",
        "11": "Strategic and analytical vision for understanding complex business processes and decision preparation.",
        "12": "Proficient in finance and data analysis, supporting stability and data-driven decision-making.",
        "13": "Technically oriented professional focused on system operation and efficient troubleshooting.",
        "14": "Responsible and disciplined career committed to the full observance of safety regulations and order.",
        "15": "Versatile and flexible colleague with outstanding adaptability in any corporate environment."
    },
    de: {
        "1": "Fachkraft mit mehrjähriger Managementerfahrung, spezialisiert auf strategische Planung und Teamführung.",
        "2": "Technologieorientierter Profi mit Fokus auf innovative Lösungen und effiziente Problemlösung.",
        "3": "Präzise und systematische Arbeitsweise in der Verwaltung und Unternehmensdokumentation.",
        "4": "Kundenorientierte Einstellung zur Unterstützung langfristiger Geschäftsbeziehungen und Kundenmanagement.",
        "5": "Kreativer Profi für visuelle Kommunikation und Markenaufbau mit funktionaler Effizienz.",
        "6": "Experte für Logistikprozesse und operative Effizienz mit schneller Entscheidungsfähigkeit.",
        "7": "Engagierter Berufseinsteiger mit schneller Auffassungsgabe und verantwortungsbewusster Arbeitsmoral.",
        "8": "Zuverlässiger Facharbeiter mit hoher Ausdauer für qualitätsbewusste industrielle Ausführung.",
        "9": "Empathischer Profi, der sich der strikten Einhaltung fachlicher Protokolle verschrieben hat.",
        "10": "Premium-Gastronomieerfahrung zur Gewährleistung erstklassiger Kundenerlebnisse.",
        "11": "Strategische Vision zum Verständnis komplexer Geschäftsprozesse und Trendanalysen.",
        "12": "Kompetent in Finanzen und Datenanalyse zur Unterstützung datengesteuerter Entscheidungen.",
        "13": "Technisch orientierter Profi für Systembetrieb und effiziente Fehlerbehebung.",
        "14": "Verantwortungsbewusste und disziplinierte Karriere unter Einhaltung aller Sicherheitsvorschriften.",
        "15": "Vielseitiger und flexibler Mitarbeiter mit hervorragender Anpassungsfähigkeit in jedem Umfeld."
    }
};

// 2. SZÓTÁR (MINDEN MEZŐ FORDÍTÁSA)
const dictionary = {
    hu: { engineName: "Career-Engine", atsTitle: "🚀 GIGA ATS TIPPEK:", atsTips: "• Kulcsszavak!\n• Számok!\n• Jó fotó!", fName: "KERESZTNÉV", lName: "VEZETÉKNÉV", city: "VÁROS", street: "UTCA", type: "≡ TÍPUS", phone: "TELEFON", email: "EMAIL", summary: "BEMUTATKOZÁS", eduHeader: "TANULMÁNYOK", workHeader: "TAPASZTALAT", addEdu: "+ ÚJ ISKOLA", addWork: "+ ÚJ MUNKAHELY", printBtn: "PDF GENERÁLÁSA", addr: "Cím:", colors: "SZÍNEK", styles: "STÍLUSOK", select_hint: "-- VÁLASSZ --" },
    en: { engineName: "Career-Engine", atsTitle: "🚀 GIGA ATS TIPS:", atsTips: "• Keywords!\n• Numbers!\n• Pro Photo!", fName: "FIRST NAME", lName: "LAST NAME", city: "CITY", street: "STREET", type: "≡ TYPE", phone: "PHONE", email: "EMAIL", summary: "SUMMARY", eduHeader: "EDUCATION", workHeader: "EXPERIENCE", addEdu: "+ ADD SCHOOL", addWork: "+ ADD JOB", printBtn: "GENERATE PDF", addr: "Address:", colors: "COLORS", styles: "STYLES", select_hint: "-- SELECT --" },
    de: { engineName: "Career-Engine", atsTitle: "🚀 GIGA ATS TIPPS:", atsTips: "• Keywords!\n• Zahlen!\n• Foto!", fName: "VORNAME", lName: "NACHNAME", city: "STADT", street: "STRASSE", type: "≡ TYP", phone: "TELEFON", email: "EMAIL", summary: "PROFIL", eduHeader: "BILDUNG", workHeader: "ERFAHRUNG", addEdu: "+ SCHULE", addWork: "+ JOB", printBtn: "PDF GENERIEREN", addr: "Adresse:", colors: "FARBEN", styles: "STILE", select_hint: "-- WÄHLEN --" }
};

let currentLang = 'hu';

function setMode(l, btn) {
    currentLang = l;
    document.querySelectorAll('.btn-lang').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    updateInterface();
    // Nyelvváltáskor a bemutatkozást is frissítjük az új nyelvre a kiválasztott index alapján
    const sel = document.getElementById('sel-summary');
    if (sel && sel.value) applyMatrixSummary();
    updatePreview();
}

function updateInterface() {
    const d = dictionary[currentLang];
    for (let key in d) {
        const el = document.getElementById('lbl-' + key);
        if (el) el.innerText = d[key];
    }
    document.getElementById('lbl-atsTips').innerText = d.atsTips;
}

function applyMatrixSummary() {
    const sel = document.getElementById('sel-summary');
    const target = document.getElementById('in-summary');
    if (sel && sel.value && summaryDB[currentLang][sel.value]) {
        target.value = summaryDB[currentLang][sel.value];
        updatePreview();
    }
}

function addEntry(type) {
    const container = document.getElementById(type + '-container');
    const div = document.createElement('div');
    div.className = 'entry-box';
    div.innerHTML = `
        <input type="text" class="e-main" placeholder="Név / Name / Name" oninput="updatePreview()">
        <input type="text" class="e-sub" placeholder="Idő / Period / Zeitraum" oninput="updatePreview()">
        <button style="position:absolute; top:5px; right:5px; background:red; color:white; border:none; cursor:pointer;" onclick="this.parentElement.remove(); updatePreview();">×</button>
    `;
    container.appendChild(div);
    updatePreview();
}

function updatePreview() {
    const d = dictionary[currentLang];
    const l = document.getElementById('in-lastName').value || "";
    const f = document.getElementById('in-firstName').value || "";
    document.getElementById('out-name').innerText = (currentLang === 'hu' ? l + " " + f : f + " " + l).toUpperCase() || "NAME";

    let html = `<h3>${d.summary}</h3><p style="white-space: pre-wrap;">${document.getElementById('in-summary').value}</p>`;

    ['edu', 'work'].forEach(type => {
        let sectionHtml = `<h3>${d[type + 'Header']}</h3>`;
        document.querySelectorAll('#' + type + '-container .entry-box').forEach(box => {
            const main = box.querySelector('.e-main').value;
            const sub = box.querySelector('.e-sub').value;
            if(main) sectionHtml += `<div><b>${main}</b> (${sub})</div>`;
        });
        html += sectionHtml;
    });
    document.getElementById('main-content').innerHTML = html;
}

window.onload = () => {
    // Szín- és stílusválasztó generálása
    const colors = ["#007bb5", "#e67e22", "#27ae60", "#c0392b", "#8e44ad"];
    colors.forEach(c => {
        let b = document.createElement('div'); b.className = 'color-btn'; b.style.background = c;
        b.onclick = () => { document.documentElement.style.setProperty('--main-color', c); updatePreview(); };
        document.getElementById('color-picker').appendChild(b);
    });
    for(let i=1; i<=10; i++) {
        let b = document.createElement('button'); b.className = 'style-btn'; b.innerText = i;
        b.onclick = () => { document.body.className = 'style-' + i; updatePreview(); };
        document.getElementById('style-picker').appendChild(b);
    }
    updateInterface();
    updatePreview();
};
</script>
</body>
</html>
